<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARES-1 工程模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E6E9EC; --surface:#F7F8F9; --surface2:#EDF0F2; --ink:#16202A; --ink2:#4A5763; --ink3:#76828D;
  --line:#CCD3D9; --accent:#B14E1C; --accent-soft:#F2DFD3; --accent-ink:#FFFFFF;
  --ok:#2D7746; --warn:#96600F; --bad:#AE3333; --info:#34689F;
  --st-c:#2D7746; --st-e:#96600F; --st-m:#A0376C; --st-d:#34689F;
  --scene-bg:#DCE1E5; --ground:#CBBDAB; --grid:#B3A695;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --display:"Chakra Petch", "Noto Sans TC", system-ui, sans-serif;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151A; --surface:#171E25; --surface2:#1D2630; --ink:#E3E8ED; --ink2:#9EABB7; --ink3:#72808C;
    --line:#2A3540; --accent:#E27B45; --accent-soft:#3A261B; --accent-ink:#1A0F08;
    --ok:#61BC81; --warn:#D7A24C; --bad:#E36E6E; --info:#74A6DD;
    --st-c:#61BC81; --st-e:#D7A24C; --st-m:#DB7DAE; --st-d:#74A6DD;
    --scene-bg:#141A20; --ground:#3A322B; --grid:#51463B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151A; --surface:#171E25; --surface2:#1D2630; --ink:#E3E8ED; --ink2:#9EABB7; --ink3:#72808C;
  --line:#2A3540; --accent:#E27B45; --accent-soft:#3A261B; --accent-ink:#1A0F08;
  --ok:#61BC81; --warn:#D7A24C; --bad:#E36E6E; --info:#74A6DD;
  --st-c:#61BC81; --st-e:#D7A24C; --st-m:#DB7DAE; --st-d:#74A6DD;
  --scene-bg:#141A20; --ground:#3A322B; --grid:#51463B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:344px minmax(0,1fr) 330px;grid-template-rows:auto minmax(0,1fr);height:100%;min-height:560px}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.06em}
.brand .mark i{font-style:normal;color:var(--accent)}
.brand .sub{color:var(--ink2);font-size:13px}
.views{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.views button,.seg button,.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;line-height:1.3}
.views button:hover,.seg button:hover,.btn:hover{border-color:var(--ink3)}
.views button[aria-pressed="true"],.seg button[aria-pressed="true"],.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{grid-column:1;grid-row:2;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 2px;cursor:pointer;font-size:13px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabpane{padding-block:14px 28px;padding-inline:16px;overflow:auto;min-height:0;flex:1}
.tabpane h3{font-size:12px;letter-spacing:.08em;color:var(--ink3);margin:18px 0 8px;font-weight:500}
.tabpane h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding-block:5px}
.row label{flex:1;min-width:0}
.seg{display:inline-flex;gap:3px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;padding-block:4px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding-block:6px;border-bottom:1px dashed var(--line)}
.slider:last-child{border-bottom:0}
.slider .lab{display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.slider .val{font-family:var(--mono);font-size:13px;text-align:right}
.slider input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.slider .hint{grid-column:1/-1;font-size:12px;color:var(--ink3)}
.tag{display:inline-block;font-size:11px;line-height:1;padding:3px 5px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;font-weight:500}
.tag.c{color:var(--st-c)} .tag.e{color:var(--st-e)} .tag.m{color:var(--st-m)} .tag.d{color:var(--st-d)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.pass{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.fail{color:var(--bad)} .pill.info{color:var(--info)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.muted{color:var(--ink2)} .small{font-size:12px}
p{margin:6px 0}

.stage{grid-column:2;grid-row:2;position:relative;min-height:0;background:var(--scene-bg);overflow:hidden}
#viewport{position:absolute;inset:0}
#viewport canvas{display:block;touch-action:none}
.hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 24px)}
.hud .card{background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;backdrop-filter:blur(6px);pointer-events:auto}
.hud .kv{display:grid;grid-template-columns:auto auto;gap:1px 12px;font-size:12px}
.hud .kv b{font-weight:400;color:var(--ink2)}
.hud .kv span{font-family:var(--mono);text-align:right}
.checksum{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.checksum button{cursor:pointer}
.yawbar{white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px);max-width:calc(100% - 24px)}
.yawbar input{width:200px;max-width:40vw;accent-color:var(--accent)}
.yawbar .num{min-width:52px;text-align:right}
.stepbar{position:absolute;left:12px;right:12px;bottom:62px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--accent);border-radius:var(--radius);padding:10px 12px;display:none;gap:4px;flex-direction:column;backdrop-filter:blur(6px);max-width:560px}
.stepbar.on{display:flex}
.stepbar .t{font-weight:700}
.legend{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;font-size:11px}
.lbl{font-size:11px;padding:1px 6px;border-radius:4px;background:color-mix(in srgb,var(--surface) 85%,transparent);border:1px solid var(--line);color:var(--ink);white-space:nowrap;pointer-events:none}
.lbl.dim{font-family:var(--mono);border-color:var(--accent);color:var(--accent)}
.lbl.cg{font-family:var(--mono);background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.inspector{grid-column:3;grid-row:2;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding-block:14px 28px;padding-inline:16px;min-height:0}
.inspector h2{font-size:18px;margin:0 0 2px;text-wrap:balance}
.inspector .kind{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.inspector h4{font-size:12px;letter-spacing:.08em;color:var(--ink3);margin:14px 0 6px;font-weight:500}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink2);font-size:12px}
td.v{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto;max-width:100%}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:var(--surface2);border-radius:0 6px 6px 0;font-size:13px;margin:8px 0}
.note.bad{border-left-color:var(--bad)} .note.ok{border-left-color:var(--ok)} .note.info{border-left-color:var(--info)}
.checklist{display:flex;flex-direction:column;gap:6px}
.chk{border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;background:var(--surface2);cursor:pointer;text-align:left;display:block;width:100%}
.chk:hover{border-color:var(--ink3)}
.chk .h{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chk .h b{font-weight:500}
.chk .d{font-size:12px;color:var(--ink2);margin-top:3px}
.chk.pass .st{color:var(--ok)} .chk.warn .st{color:var(--warn)} .chk.fail .st{color:var(--bad)} .chk.info .st{color:var(--info)}
.chk.fail{border-color:var(--bad)}
.wire{display:grid;grid-template-columns:14px 1fr;gap:2px 8px;padding-block:6px;border-bottom:1px solid var(--line);cursor:pointer}
.wire .sw{width:14px;height:14px;border-radius:3px;margin-top:3px}
.wire .n{font-weight:500}
.wire .m{grid-column:2;font-size:12px;color:var(--ink2)}
.steps{display:flex;flex-direction:column;gap:4px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface2);cursor:pointer;text-align:left;width:100%}
.step[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.step .n{font-family:var(--mono);color:var(--accent);margin-right:6px}
details{border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;background:var(--surface2)}
details>summary{cursor:pointer;padding:8px 10px;font-weight:500}
details>div{padding:0 10px 10px}
ul.clean{margin:4px 0;padding-left:18px}
ul.clean li{margin:3px 0}
.kbd{font-family:var(--mono);font-size:12px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--surface2)}
textarea.export{width:100%;min-height:140px;font-family:var(--mono);font-size:12px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px}

@media (max-width:1180px){
  .app{grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:auto;min-height:100%}
  .stage{height:68vh;min-height:420px}
  .panel{grid-row:2 / span 2;max-height:none}
  .inspector{grid-column:2;grid-row:3;border-left:0;border-top:1px solid var(--line);max-height:none}
}
@media (max-width:760px){
  .app{display:flex;flex-direction:column}
  .stage{height:58vh;min-height:340px;order:1}
  .inspector{order:2;border-top:1px solid var(--line)}
  .panel{order:3;border-right:0;border-top:1px solid var(--line)}
  .tabpane{overflow:visible}
  .checksum{max-width:50%}
  .yawbar input{width:120px}
  .brand .sub{display:none}
  .legend{display:none}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto!important} }
</style>

</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="mark">ARES<i>-1</i></span><span class="sub">直立式雙履帶火星探測車 · 工程模型</span></div>
    <nav class="views" aria-label="視角">
      <button data-view="iso" aria-pressed="true">等角</button>
      <button data-view="front">正面</button>
      <button data-view="side">側面</button>
      <button data-view="top">頂面</button>
      <button data-view="bottom">底面</button>
      <button data-view="rear">背面</button>
      <button data-view="head">頭部特寫</button>
    </nav>
  </header>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="view" aria-selected="true">顯示</button>
      <button role="tab" data-tab="param" aria-selected="false">參數</button>
      <button role="tab" data-tab="check" aria-selected="false">檢查</button>
      <button role="tab" data-tab="wire" aria-selected="false">配線</button>
      <button role="tab" data-tab="asm" aria-selected="false">組裝</button>
      <button role="tab" data-tab="spec" aria-selected="false">規格</button>
    </div>

    <div class="tabpane" data-pane="view">
      <h3>外殼</h3>
      <div class="seg" id="shellMode">
        <button data-v="solid" aria-pressed="true">實體</button>
        <button data-v="xray" aria-pressed="false">透明外殼</button>
        <button data-v="hide" aria-pressed="false">內部結構</button>
      </div>
      <h3>爆炸視圖</h3>
      <div class="slider"><div class="lab">分離程度</div><div class="val" id="explodeVal">0%</div>
        <input type="range" id="explode" min="0" max="100" value="0" step="1"></div>
      <h3>剖面</h3>
      <div class="seg" id="sectionMode">
        <button data-v="off" aria-pressed="true">關閉</button>
        <button data-v="x" aria-pressed="false">左右剖</button>
        <button data-v="z" aria-pressed="false">前後剖</button>
      </div>
      <div class="slider"><div class="lab">剖切位置</div><div class="val" id="sectionVal">0 mm</div>
        <input type="range" id="section" min="-100" max="100" value="0" step="1"></div>
      <h3>疊加資訊</h3>
      <label class="check"><input type="checkbox" id="optWires"> 配線走線</label>
      <label class="check"><input type="checkbox" id="optDims" checked> 主要尺寸標註</label>
      <label class="check"><input type="checkbox" id="optCG"> 重心與支撐面</label>
      <label class="check"><input type="checkbox" id="optFov"> 鏡頭視野</label>
      <label class="check"><input type="checkbox" id="optSweep"> 頭部旋轉範圍</label>
      <label class="check"><input type="checkbox" id="optClash" checked> 標示干涉零件</label>
      <label class="check"><input type="checkbox" id="optLabels"> 零件名稱</label>
      <label class="check"><input type="checkbox" id="optMission"> 未來任務模組（推土板）預覽</label>
      <h3>分層顯示</h3>
      <label class="check"><input type="checkbox" id="layChassis" checked> 底盤層</label>
      <label class="check"><input type="checkbox" id="layBody" checked> 身體層</label>
      <label class="check"><input type="checkbox" id="layHead" checked> 頭部層</label>
      <h3>換行動電源</h3>
      <button class="btn primary" id="btnBat">換行動電源示範</button>
      <p class="small muted">行動電源躺在馬達正上方的電池艙，從車尾整個抽出來，不拆外殼、不翻車。</p>
      <h3>操作</h3>
      <p class="small muted">拖曳旋轉 · 滾輪或雙指縮放 · 右鍵或雙指拖曳平移 · 點零件看規格。</p>
    </div>

    <div class="tabpane" data-pane="param" hidden>
      <h3>配置方案</h3>
      <div class="seg" id="layoutSeg">
        <button data-v="B" aria-pressed="true">B 對角馬達（主方案）</button>
        <button data-v="A" aria-pressed="false">A 同軸後置</button>
        <button data-v="C" aria-pressed="false">C 長頸桅杆</button>
      </div>
      <p class="small muted" id="layoutNote"></p>
      <h3>行動電源（學員自備）</h3>
      <div class="seg" id="bankSeg"></div>
      <div class="seg" id="mountSeg" style="margin-top:6px">
        <button data-v="deck" aria-pressed="true">放電池艙（推薦）</button>
        <button data-v="back" aria-pressed="false">掛背後（比較用）</button>
      </div>
      <p class="small muted" id="bankNote"></p>
      <div id="paramGroups"></div>
      <h3>麥克風位置</h3>
      <div class="seg" id="micSeg">
        <button data-v="head" aria-pressed="true">頭部（推薦）</button>
        <button data-v="body" aria-pressed="false">身體上後方</button>
      </div>
      <h3>輸出</h3>
      <div class="row" style="justify-content:flex-start;gap:6px;flex-wrap:wrap">
        <button class="btn" id="btnReset">重設為主方案</button>
        <button class="btn" id="btnScad">產生 OpenSCAD 參數</button>
      </div>
      <textarea class="export" id="scadOut" hidden readonly aria-label="OpenSCAD 參數"></textarea>
      <p class="small muted" id="scadMsg"></p>
    </div>

    <div class="tabpane" data-pane="check" hidden>
      <div id="checkSummary" class="row" style="justify-content:flex-start;flex-wrap:wrap"></div>
      <div id="checkList"></div>
    </div>

    <div class="tabpane" data-pane="wire" hidden>
      <label class="check"><input type="checkbox" id="optWires2"> 在模型中顯示配線（其他零件淡化）</label>
      <h3>電源樹</h3>
      <div id="powerTree"></div>
      <h3>走線清單（點選可在模型中標示）</h3>
      <div id="wireList"></div>
      <h3>ESP32-S3-CAM 腳位分配</h3>
      <div id="gpioTable"></div>
    </div>

    <div class="tabpane" data-pane="asm" hidden>
      <div class="row" style="justify-content:flex-start;gap:6px;flex-wrap:wrap">
        <button class="btn primary" id="asmStart">開始組裝展示</button>
        <button class="btn" id="asmPrev">上一步</button>
        <button class="btn" id="asmNext">下一步</button>
        <button class="btn" id="asmExit">結束</button>
      </div>
      <div class="steps" id="asmList" style="margin-top:10px"></div>
    </div>

    <div class="tabpane" data-pane="spec" hidden>
      <div id="specPane"></div>
    </div>
  </aside>

  <main class="stage" aria-label="3D 模型">
    <div id="viewport"><div class="loading" id="loading">正在載入 3D 引擎…</div></div>
    <div class="hud">
      <div class="card"><div class="kv" id="hudKv"></div></div>
    </div>
    <div class="checksum" id="hudChecks"></div>
    <div class="stepbar" id="stepbar"><div class="t" id="stepTitle"></div><div class="small" id="stepText"></div></div>
    <div class="yawbar">
      <span class="small">頭部轉角</span>
      <input type="range" id="yaw" min="-45" max="45" value="0" step="1" aria-label="頭部轉角">
      <span class="num" id="yawVal">0°</span>
      <button class="btn" id="yawScan">掃描</button>
    </div>
    <div class="legend" id="legend">
      <span class="tag c">已確認</span><span class="tag e">估計</span><span class="tag m">待量測</span><span class="tag d">設計值</span>
    </div>
  </main>

  <section class="inspector" id="inspector" aria-live="polite"></section>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

   0. 小工具

const D2R = Math.PI / 180;
const $ = (s, e = document) => e.querySelector(s);
const $$ = (s, e = document) => [...e.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fx = (v, d = 1) => (Math.abs(v) < 1e-9 ? 0 : v).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const G = 9.81;

const ST = {
  C: { cls: 'c', label: '已確認' },

const SERVO = { l: 23.2, w: 12.1, h: 22.7, tabSpan: 32.1, tabT: 2.5, tabZ: 15.9, shaftOff: 5.9, bossD: 11.8, bossH: 4.0, holeSp: 27.8, hornD: 20, hornH: 4.2 };
// ESP32-S3-CAM
const ESP = { l: 62.6, w: 28.3, t: 1.6, rowSp: 24.7, antOver: 4.3, shield0: 1.9, shield1: 21.2, fpcX: -2.5, pinLen: 8.5, dupont: 14, bend: 6 };
// GOOUUU ESP32-S3-CAM（N16R8）：沿長邊從天線端量起；天線約突出 PCB 4.3 mm，相機 FPC 座在中間略偏天線端

let P = { ...DEFAULTS };

/* =========================================================
   2. 幾何配置（所有位置都由參數推導）
   座標：X＝車子左側（從車尾往前看）、Y＝向上、Z＝車頭方向，原點在地面中心
   ========================================================= */
function computeLayout(P) {
  const L = {};
  const coax = P.layout === 'A';
  L.coax = coax;
  L.PD = P.trackPitch / Math.sin(Math.PI / P.sprocketTeeth);
  L.R = L.PD / 2;
  L.pinY = P.grouser + P.trackT / 2;
  L.axleY = L.pinY + L.R;
  L.trackTop = L.axleY + L.R + P.trackT / 2 + P.grouser;
  L.hw = P.innerW / 2;
  L.wallOut = L.hw + P.plateT;
  L.trackX0 = L.wallOut + P.trackGap;
  L.trackCx = L.trackX0 + P.trackW / 2;
  L.trackOut = L.trackX0 + P.trackW;
  L.zS = P.wheelbase / 2;
  L.loop = 2 * P.wheelbase + Math.PI * L.PD;
  L.linksExact = L.loop / P.trackPitch;
  L.links = Math.round(L.linksExact);
  L.motorTotal = P.gearLen + P.motorCan + P.encLen;
  L.mR = P.motorD / 2;
  L.motorBottom = L.axleY - L.mR;
  L.floorTop = P.floorY + P.floorT;
  L.clearance = Math.min(P.floorY, L.motorBottom);
  L.tubLen = Math.ceil(P.wheelbase + P.motorD + 2 * (3 + 6));
  L.tubZ0 = -L.tubLen / 2; L.tubZ1 = L.tubLen / 2;
  L.endWallT = 3;
  // 底盤是「雙層巴士」：下層馬達＋驅動板＋電源區，上層整層是行動電源的電池艙
  L.bay = P.bankMount !== 'back';
  L.trayY0 = L.axleY + L.mR + 0.8;               // 托盤底面＝馬達頂 +0.8
  L.trayT = 1.6; L.trayTop = L.trayY0 + L.trayT;
  L.deckY0 = L.bay ? L.trayTop + P.bayH : Math.max(L.trackTop + 0.6, L.trayY0);
  L.deckY1 = L.deckY0 + P.deckT;

  const mk = (side, sign, z) => {
    const flangeX = sign * L.hw;
    const innerX = flangeX - sign * L.motorTotal;
    const fz = z > 0 ? -1 : 1;                    // 編碼器 6P 接頭水平朝車身中央（上面有托盤）
    const ca = innerX + sign * 1.5, cb = innerX + sign * 9.5, za = z + fz * (L.mR - 1.5), zb = z + fz * (L.mR + 10);
    return { side, sign, z, flangeX, innerX, fz,
      conn: { x: innerX + sign * 5.5, y: L.axleY, z: z + fz * (L.mR + 6) },
      connBox: { x0: Math.min(ca, cb), x1: Math.max(ca, cb), y0: L.axleY - 4.5, y1: L.axleY + 4.5, z0: Math.min(za, zb), z1: Math.max(za, zb) },
      box: { x0: Math.min(flangeX, innerX), x1: Math.max(flangeX, innerX), y0: L.axleY - L.mR, y1: L.axleY + L.mR, z0: z - L.mR, z1: z + L.mR } };
  };
  L.mL = mk('L', +1, -L.zS);
  L.mR_ = mk('R', -1, coax ? -L.zS : +L.zS);
  L.wheels = [
    { id: 'sprL', side: 'L', x: +L.trackCx, z: L.mL.z, drive: true },
    { id: 'idlL', side: 'L', x: +L.trackCx, z: -L.mL.z, drive: false },
    { id: 'sprR', side: 'R', x: -L.trackCx, z: L.mR_.z, drive: true },
    { id: 'idlR', side: 'R', x: -L.trackCx, z: -L.mR_.z, drive: false },
  ];

  // 馬達尾端托架（束線帶綁住馬達）
  L.cradles = [];
  for (const mo of [L.mL, L.mR_]) {
    const cx = mo.innerX + mo.sign * (P.encLen + 6);
    for (const s of [-1, 1]) { const za = mo.z + s * 12.9, zb = mo.z + s * 16.4; L.cradles.push({ cx, mz: mo.z, x0: cx - 3, x1: cx + 3, y0: L.floorTop, y1: L.axleY, z0: Math.min(za, zb), z1: Math.max(za, zb) }); }
  }

  // 右側線材通道（地板直通上身底板）與電池艙
  L.chX0 = -L.hw; L.chX1 = -L.hw + 16;
  L.lipX0 = L.chX1; L.lipX1 = L.chX1 + 2;          // 托盤右緣立邊：兼通道牆與行動電源導軌
  L.pillarW = 7;
  L.bayX0 = L.lipX1; L.bayX1 = L.hw - L.pillarW;   // 可用寬（預設 85）
  L.bayZ1 = L.tubZ1 - L.endWallT;                  // 前壁就是擋塊，後方整個打開
  L.pillars = [
    { x0: L.hw - L.pillarW, x1: L.hw, z0: -33.5, z1: -26.5 },
    { x0: L.hw - L.pillarW, x1: L.hw, z0: 26.5, z1: 33.5 },
    { x0: -L.hw, x1: -L.hw + L.pillarW, z0: 18.5, z1: 25.5 },
    { x0: -L.hw, x1: -L.hw + L.pillarW, z0: L.tubZ0 + L.endWallT, z1: L.tubZ0 + L.endWallT + 6 },
  ].map(p => ({ ...p, y0: L.floorTop, y1: L.deckY0 }));
  L.trayPost = { x0: L.lipX0 - 2, x1: L.lipX1, y0: L.floorTop, y1: L.trayY0, z0: 20, z1: 26 };
  L.strapSlots = [-55, -10, 35];                   // 魔鬼氈扣孔（每側兩個一組）
  L.slotX = [L.lipX1 + 2.5, L.lipX1 + 10.5, L.bayX1 - 10.5, L.bayX1 - 2.5];
  {
    const zs = [L.tubZ0 + 6, ...L.strapSlots.flatMap(z => [z - 13, z + 13]), L.bayZ1 - 6];
    L.trayWins = [];
    for (let i = 0; i < zs.length; i += 2) if (zs[i + 1] - zs[i] > 10) L.trayWins.push([L.lipX1 + 16, zs[i], L.bayX1 - 16, zs[i + 1]]);
  }

  // 馬達驅動板（DRV8870 雙路，48×30）：放右側，排針那一長邊在線材通道正下方
  const d = {};
  d.x = -(L.hw - 4 - P.drvW / 2);
  d.z = -12;
  d.y0 = L.floorTop + 4; d.y1 = d.y0 + 12;
  d.hole = [11.4, 20.4];                          // 孔距 22.8 × 40.8（由 R3.6 圓角推得）
  d.box = { x0: d.x - P.drvW / 2, x1: d.x + P.drvW / 2, y0: d.y0, y1: d.y1, z0: d.z - P.drvL / 2, z1: d.z + P.drvL / 2 };
  d.tz = i => d.box.z0 + 9 + i * 5.08;            // 端子：0 VM、1 G、2 OUT1 … 5 OUT4（朝車身中央，VM 在後端）
  d.hdrX = d.box.x0 + 2.5;                        // 排針：IN1 IN2 IN3 IN4 VO G S1 G S2 G（IN1 在後端）
  d.hdrZ = i => d.box.z0 + 8 + i * 2.54;
  d.hdrTop = d.y0 + 1.6 + 16.5;                   // 杜邦頭頂
  L.drv = d;

  // 電源區（下層右後角）：CH224K 誘騙板、Mini560、AMS1117；USB-C 從後壁伸出
  // 同軸方案車尾被馬達佔滿，改到右前、USB-C 從前壁伸出
  {
    const front = coax, s = front ? -1 : 1;
    const zi = front ? L.tubZ1 - L.endWallT : L.tubZ0 + L.endWallT;   // 牆內面
    const zr = (a, b) => ({ z0: Math.min(zi + s * a, zi + s * b), z1: Math.max(zi + s * a, zi + s * b) });
    const pw = { front, s, wallZ: front ? L.tubZ1 : L.tubZ0 };
    const y0 = L.floorTop + 3;
    pw.pd = { x0: -L.hw + 15, x1: -L.hw + 27, y0, y1: y0 + 4.8, ...zr(-2.5, 22) };   // PCB 穿過牆孔，母座和外牆面齊
    pw.usbX = (pw.pd.x0 + pw.pd.x1) / 2;
    pw.buck = { x0: -L.hw + 28.5, x1: -L.hw + 28.5 + P.buckW, y0, y1: y0 + P.buckH, ...zr(0.5, 0.5 + P.buckL) };
    pw.ldo = { x0: -L.hw + 1, x1: -L.hw + 12, y0, y1: y0 + 4, ...zr(8, 30) };
    const cx = d.box.x1 + 6.5, cz = d.tz(0);       // C1 躺在端子旁，腳朝後（靠 VM 與電源區）
    pw.cap = { x: cx, y: L.floorTop + 5, r: 5, z0: cz - 5, z1: cz + 15, x0: cx - 5, x1: cx + 5, y0: L.floorTop, y1: L.floorTop + 10 };
    L.pwr = pw;
    L.usbY = y0 + 1.6 + 1.6;
  }

  // 上身線孔（對準通道）與 J1/J2
  L.deckHole = { x0: L.chX0 + 7, x1: L.chX1 - 1, z0: -36, z1: -10 };
  L.conn = { x0: L.chX0 + 6.5, x1: L.chX0 + 12.5, y0: L.deckY0 - 9, y1: L.deckY0 - 2, j1: [L.deckHole.z0 + 2, L.deckHole.z0 + 19.5], j2: [L.deckHole.z1 - 2, L.deckHole.z1 + 20.5] };

  // 身體
  L.bodyY0 = L.deckY1; L.bodyY1 = L.bodyY0 + P.bodyH;
  L.bodyZ0 = -P.bodyD / 2; L.bodyZ1 = P.bodyD / 2;
  L.bw = P.bodyW / 2;
  L.inW = L.bw - P.shellT; L.inZ0 = L.bodyZ0 + P.shellT; L.inZ1 = L.bodyZ1 - P.shellT;
  L.topT = 4; L.topY1 = L.bodyY1; L.topY0 = L.topY1 - L.topT;
  L.wingX1 = L.inW - 1.4; L.wingX0 = L.wingX1 - 3;
  L.spineZ0 = P.neckZ + 10; L.spineZ1 = L.spineZ0 + 3;
  L.frameTop = L.topY0;
  // 喇叭（前方，用墊高環貼齊格柵）
  L.spk = { x: 0, zF: L.inZ1 - 1, r: P.spkD / 2 };
  L.spk.zB = L.spk.zF - P.spkH;
  L.spk.y = L.bodyY0 + clamp(P.bodyH * 0.5, 26, 52);
  // 功放 MAX98357A：骨架前面、喇叭旁
  L.amp = { x: clamp(L.spk.r + 14, 20, L.wingX0 - 10), y: L.bodyY0 + 14, z: L.spineZ1 + 3 };
  // 配電洞洞板：右翼內側（降壓模組已搬到底盤電源區）
  L.perf = { x0: -L.wingX0, x1: -L.wingX0 + 12, y0: Math.min(L.bodyY0 + 43, L.topY0 - 31), z1: L.spineZ0 - 3 };
  L.perf.x0 = -L.wingX0; L.perf.x1 = -L.wingX0 + 12; L.perf.y1 = L.perf.y0 + 30; L.perf.z0 = L.perf.z1 - 50;
  // 船型開關（身體頂板左後角，朝上）
  L.sw = { x: L.bw - 22, z: L.bodyZ0 + 16, y1: L.topY1, y0: L.topY1 - 18 };

  // 頸部與伺服
  L.riserH = P.neckExtra;
  L.mountY1 = L.topY1 + L.riserH;
  L.mountY0 = L.mountY1 - 4;
  L.servoY0 = L.mountY0 - SERVO.tabT - SERVO.tabZ;
  L.servoTop = L.servoY0 + SERVO.h;
  L.bossTop = L.servoTop + SERVO.bossH;
  L.hornTop = L.bossTop + SERVO.hornH;
  L.collar = { r0: 21, r1: 24, y0: L.mountY1, y1: L.mountY1 + 7 };
  L.skirt = { r0: 24.5, r1: 26.5, drop: 8.5 };
  L.pivotY = L.hornTop + 2;
  L.servoBox = { x0: -SERVO.shaftOff, x1: SERVO.l - SERVO.shaftOff, y0: L.servoY0, y1: L.servoTop, z0: P.neckZ - SERVO.w / 2, z1: P.neckZ + SERVO.w / 2 };
  L.harnessR = 16; L.bundleR = 3.5; // 15 芯（含編碼器 A/B）＋螺旋套約 Ø7
  L.stopAng = P.yawMax + 10;
  L.windowR0 = 9; L.windowR1 = L.collar.r0 - 0.5; L.windowZ = -7.5; // 線槽窗口（相對轉軸）

  // 頭部（區域座標：原點＝轉軸在頭部底面，Z 朝前）
  const h = { w: P.headW, h: P.headH, d: P.headD, zc: P.headZ, wall: 1.8, floorT: 3 };
  h.z0 = P.headZ - P.headD / 2; h.z1 = P.headZ + P.headD / 2;
  h.lensFrontZ = h.z1 - 1;
  h.pcbY = P.headH / 2 + 1;
  h.pcbFrontZ = h.lensFrontZ - P.lensH;
  h.stackDepth = P.lensH + ESP.t + ESP.pinLen + ESP.dupont + ESP.bend;
  h.backInnerZ = h.z0 + h.wall;
  h.micLocal = [ESP.l / 2 - 9, P.headH - h.wall - 1.2, h.z0 + 12];
  h.camEye = Math.abs(P.lensOffset) >= 12 ? Math.sign(P.lensOffset) : 0;   // 真鏡頭在哪一隻眼（−1＝右眼）
  h.eyeX = h.camEye ? Math.abs(P.lensOffset) : Math.min(P.headW / 2 - 18, 21);
  L.head = h;
  L.pivot = new THREE.Vector3(0, L.pivotY, P.neckZ);

  // 行動電源
  {
    const B = {};
    if (L.bay) {
      B.x = (L.bayX0 + L.bayX1) / 2;
      B.x0 = B.x - P.bankW / 2; B.x1 = B.x + P.bankW / 2;
      B.y0 = L.trayTop; B.y1 = B.y0 + P.bankT;
      B.z1 = L.bayZ1 - P.bankSpacer; B.z0 = B.z1 - P.bankL;
      B.protrude = Math.max(0, L.tubZ0 - B.z0);
      B.port = { x: B.x + P.bankW * 0.2, y: B.y0 + P.bankT / 2, z: B.z0 };     // 輸出 C 孔朝後
    } else {                                                                   // 背包式：長邊橫放貼在身體背面
      const yc = (L.bodyY0 + L.bodyY1) / 2;
      B.x = 0; B.x0 = -P.bankL / 2; B.x1 = P.bankL / 2;
      B.y0 = yc - P.bankW / 2; B.y1 = yc + P.bankW / 2;
      B.z1 = L.bodyZ0 - 3; B.z0 = B.z1 - P.bankT;
      B.protrude = 0;
      B.port = { x: B.x1, y: yc, z: (B.z0 + B.z1) / 2 };
    }
    B.y = (B.y0 + B.y1) / 2; B.z = (B.z0 + B.z1) / 2;
    B.box = { x0: B.x0, x1: B.x1, y0: B.y0, y1: B.y1, z0: B.z0, z1: B.z1 };
    L.bank = B;
    const inZ = L.strapSlots.filter(z => z > B.z0 + 12 && z < B.z1 - 12);
    L.strapZ = L.bay ? [...new Set([inZ[0], inZ[inZ.length - 1]])].filter(z => z !== undefined) : [-30, 30];
  }

  // 整體尺寸
  L.overallW = Math.max(2 * L.trackOut, P.bodyW, P.headW, L.bay ? 0 : P.bankL);
  L.overallL = Math.max(L.tubLen, 2 * L.zS + 2 * (L.R + P.trackT / 2 + P.grouser), P.bodyD);
  L.zMax = L.overallL / 2; L.zMin = Math.min(-L.overallL / 2, L.bank.z0);
  L.overallL = L.zMax - L.zMin;
  L.overallH = L.pivotY + P.headH;
  return L;
}

/* 頭部區域座標 → 世界座標 */
function headToWorld(L, yaw, x, y, z) {
  const c = Math.cos(yaw), s = Math.sin(yaw);
  return new THREE.Vector3(L.pivot.x + x * c + z * s, L.pivot.y + y, L.pivot.z - x * s + z * c);
}

/* =========================================================
   3. 質量清單與穩定性
   ========================================================= */
const PLA = 1.24e-3; // g/mm³
function massItems(P, L, yaw) {
  const it = [];
  const add = (id, name, m, x, y, z) => it.push({ id, name, m, p: new THREE.Vector3(x, y, z) });
  const hwall = (L.deckY0 - P.floorY);
  const tubVol = L.tubLen * (P.innerW + 2 * P.plateT) * P.floorT * 0.55 + (2 * P.innerW * hwall * L.endWallT + 2 * L.tubLen * hwall * P.plateT) * 0.6;
  add('tub', '底盤槽（列印）', tubVol * PLA, 0, (P.floorY + L.deckY0) / 2 - 4, 0);
  add('motorL', '左馬達', P.motorMass, (L.mL.flangeX + L.mL.innerX) / 2, L.axleY, L.mL.z);
  add('motorR', '右馬達', P.motorMass, (L.mR_.flangeX + L.mR_.innerX) / 2, L.axleY, L.mR_.z);
  for (const w of L.wheels) add(w.id, w.drive ? '驅動輪' : '惰輪', 15 * P.trackW / 30, w.x, L.axleY, w.z);
  const linkM = 1.5 * (P.trackPitch * P.trackW) / (12.5 * 30) + 0.08;
  add('trackL', '左履帶', L.links * linkM, L.trackCx, L.axleY, 0);
  add('trackR', '右履帶', L.links * linkM, -L.trackCx, L.axleY, 0);
  const B = L.bank;
  add('bank', '行動電源', P.bankMass, B.x, B.y, B.z);
  add('strap', '魔鬼氈綁帶', 6, B.x, L.bay ? B.y1 : B.y, B.z);
  if (L.bay) {
    const trayVol = (L.hw - L.lipX0) * L.tubLen * L.trayT * 0.65 + 2 * 8 * L.tubLen;
    add('tray', '電池艙托盤（列印）', trayVol * PLA, (L.lipX0 + L.hw) / 2, L.trayY0 + 2, 0);
    if (P.bankSpacer > 0) add('spacer', '前方墊塊（列印）', P.bankSpacer * (P.bankW - 6) * Math.min(P.bankT, P.bayH - 1) * 0.8 * 0.3 * PLA, B.x, L.trayTop + 5, (B.z1 + L.bayZ1) / 2);
  } else add('backpack', '背包支架（列印）', 18, 0, B.y, L.bodyZ0 - 2);
  const pw = L.pwr, mid = o => [(o.x0 + o.x1) / 2, (o.y0 + o.y1) / 2, (o.z0 + o.z1) / 2];
  add('pd', 'CH224K 誘騙板', 3, ...mid(pw.pd));
  add('buck', 'Mini560 5 V', 5, ...mid(pw.buck));
  add('ldo', 'AMS1117-3.3', 2, ...mid(pw.ldo));
  add('cap', 'C1 1000 µF', 4, pw.cap.x, pw.cap.y, (pw.cap.z0 + pw.cap.z1) / 2);
  add('driver', 'DRV8870 驅動板', 15, L.drv.x, L.drv.y0 + 5, L.drv.z);
  add('conn', 'J1／J2 接頭', 5, (L.conn.x0 + L.conn.x1) / 2, (L.conn.y0 + L.conn.y1) / 2, L.deckHole.z0 + 10);
  add('wiresC', '底盤線材', 15, 0, (L.floorTop + L.deckY0) / 2, 0);
  const deckVol = L.tubLen * (P.innerW + 2 * P.plateT) * P.deckT * 0.5;
  const fh = L.frameTop - L.bodyY0;
  const spineVol = 2 * L.wingX1 * fh * 3 * 0.5;
  const wingVol = 2 * (L.spineZ1 - (L.inZ0 + 2)) * fh * 3 * 0.5;
  add('frame', '上身骨架（列印）', (deckVol + spineVol + wingVol) * PLA * 1.35, 0, (deckVol * (L.deckY0 + 1.5) + (spineVol + wingVol) * (L.bodyY0 + fh / 2)) / (deckVol + spineVol + wingVol), (spineVol * L.spineZ0 + wingVol * (L.spineZ1 + L.inZ0) / 2) / (deckVol + spineVol + wingVol));
  const topVol = (2 * L.inW) * (L.inZ1 - L.inZ0) * L.topT * 0.5 + 2 * Math.PI * 22.5 * 3 * 7 + (L.riserH > 0 ? 4 * 36 * L.riserH * 2.4 : 0);
  add('topPlate', '頂板／頸座（列印）', topVol * PLA, 0, L.topY0 + 2 + L.riserH / 2, 0);
  const shellVol = 2 * (P.bodyW + P.bodyD) * P.bodyH * P.shellT;
  add('shell', '身體外殼（列印）', shellVol * PLA, 0, (L.bodyY0 + L.bodyY1) / 2, 0);
  add('speaker', '喇叭＋墊環', 29, 0, L.spk.y, (L.spk.zF + L.spk.zB) / 2);
  add('amp', 'MAX98357A', 2, L.amp.x, L.amp.y, L.amp.z);
  add('perf', '配電洞洞板', 10, (L.perf.x0 + L.perf.x1) / 2, (L.perf.y0 + L.perf.y1) / 2, (L.perf.z0 + L.perf.z1) / 2);
  add('switch', '電源開關', 6, L.sw.x, L.sw.y0 + 8, L.sw.z);
  add('servo', 'SG92R', 13, (L.servoBox.x0 + L.servoBox.x1) / 2, (L.servoY0 + L.servoTop) / 2, P.neckZ);
  add('wiresB', '身體線材', 15, 0, (L.bodyY0 + L.bodyY1) / 2 + 10, -25);
  const h = L.head;
  const hoodVol = (P.headW * P.headH + P.headW * P.headD + 2 * P.headH * P.headD) * h.wall;
  const hw = (id, name, m, x, y, z) => { const w = headToWorld(L, yaw, x, y, z); add(id, name, m, w.x, w.y, w.z); };
  hw('headFloor', '頭部轉盤＋舵盤', P.headW * P.headD * h.floorT * 0.6 * PLA + 3, 0, 0, h.zc);
  hw('headHood', '頭罩（列印）', hoodVol * PLA + 4, 0, P.headH * 0.6, h.zc + 3);
  hw('headBack', '頭部後蓋', P.headW * P.headH * h.wall * PLA, 0, P.headH / 2, h.z0 + 1);
  hw('esp32', 'ESP32-S3-CAM', 14, 0, h.pcbY, h.pcbFrontZ - 3);
  hw('wiresH', '頭部線材', 5, 0, h.pcbY - 6, h.z0 + 12);
  if (P.micInHead) hw('mic', 'INMP441', 1, ...h.micLocal);
  else add('mic', 'INMP441', 1, -L.bw + 14, L.topY0 - 3, L.bodyZ0 + 12);
  return it;
}

function stability(P, L, yaw) {
  const items = massItems(P, L, yaw);
  let m = 0; const c = new THREE.Vector3();
  for (const i of items) { m += i.m; c.addScaledVector(i.p, i.m); }
  c.multiplyScalar(1 / m);
  const edgeX = L.trackOut, edgeZ = L.zS;
  const r = {
    items, mass: m, cg: c,
    sideDeg: Math.atan((edgeX - Math.abs(c.x)) / c.y) / D2R,
    frontDeg: Math.atan((edgeZ - c.z) / c.y) / D2R,
    rearDeg: Math.atan((edgeZ + c.z) / c.y) / D2R,
    aFront: G * (edgeZ - c.z) / c.y,
    aRear: G * (edgeZ + c.z) / c.y,
    aSide: G * (edgeX - Math.abs(c.x)) / c.y,
    aTraction: P.mu * G,
    slideDeg: Math.atan(P.mu) / D2R,
  };
  r.aTipMin = Math.min(r.aFront, r.aRear, r.aSide);
  r.aRamp = Math.min(r.aTipMin, r.aTraction) * 0.35;
  return r;
}

/* =========================================================
   4. 干涉與設計檢查
   ========================================================= */
function overlap(a, b) {
  const ox = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0);
  const oy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
  const oz = Math.min(a.z1, b.z1) - Math.max(a.z0, b.z0);
  if (ox > 0 && oy > 0 && oz > 0) return { hit: true, depth: Math.min(ox, oy, oz), ox, oy, oz };
  const gap = Math.max(-ox, -oy, -oz, 0);
  return { hit: false, gap: Math.sqrt(Math.max(0, -ox) ** 2 + Math.max(0, -oy) ** 2 + Math.max(0, -oz) ** 2) || gap };
}
function cameraFrame(P, L, yaw) {
  const h = L.head;
  const lens = headToWorld(L, yaw, P.lensOffset, h.pcbY, h.lensFrontZ);
  const t = P.camTilt * D2R;
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(t), -Math.sin(t), Math.cos(yaw) * Math.cos(t));
  const half = Math.tan(P.fovDiag / 2 * D2R);
  const vfov = 2 * Math.atan(half * 0.6) / D2R, hfov = 2 * Math.atan(half * 0.8) / D2R;
  return { lens, dir, vfov, hfov };
}
function fovOcclusion(P, L, yaw) {
  const cf = cameraFrame(P, L, yaw);
  const low = P.camTilt + cf.vfov / 2;              // 最低視線俯角
  const dx = Math.sin(yaw), dz = Math.cos(yaw);
  const tx = dx > 1e-6 ? (L.bw - cf.lens.x) / dx : dx < -1e-6 ? (-L.bw - cf.lens.x) / dx : Infinity;
  const tz = dz > 1e-6 ? (L.bodyZ1 - cf.lens.z) / dz : Infinity;
  const dist = Math.max(0.1, Math.min(tx, tz));
  const edgeAng = Math.atan((cf.lens.y - L.bodyY1) / dist) / D2R;
  const occ = clamp((low - edgeAng) / cf.vfov, 0, 1);
  const groundNear = low > 0 ? cf.lens.y / Math.tan(low * D2R) : Infinity;
  return { occ, low, edgeAng, groundNear, vfov: cf.vfov, hfov: cf.hfov };
}

function runChecks(P, L) {
  const C = [];
  const add = (grp, title, status, value, detail, parts = []) => C.push({ grp, title, status, value, detail, parts });
  const mL = L.mL.box, mR = L.mR_.box;
  const st = stability(P, L, 0);

  // 1 兩顆馬達
  const mm = overlap(mL, mR);
  if (mm.hit) add('機構干涉', '兩顆 JGA25-370 互相干涉', 'fail', `重疊 ${fx(mm.ox)} mm`,
    `同軸對頂需要內寬 ≥ 2×${fx(L.motorTotal)}＋4 = ${fx(2 * L.motorTotal + 4)} mm，目前 ${P.innerW} mm。改用對角配置或加寬底盤。`, ['motorL', 'motorR']);
  else add('機構干涉', '兩顆 JGA25-370 互相干涉', 'pass', `最近 ${fx(mm.gap)} mm`,
    L.coax ? '同軸配置在目前內寬下不相撞。' : '對角配置：左馬達在後、右馬達在前，前後錯開，完全不重疊。', ['motorL', 'motorR']);

  // 2 馬達尾端 vs 對側壁
  const endGap = (L.hw - L.motorTotal) + L.hw;
  add('機構干涉', '馬達尾端離對側側壁', endGap < 3 ? 'fail' : endGap < 8 ? 'warn' : 'pass', `${fx(endGap)} mm`,
    `馬達總長 ${fx(L.motorTotal)} mm（減速箱 L 為估計值）。尾端還要接 6P 編碼器線，建議至少留 8 mm。`, ['motorL', 'motorR', 'tub']);

  // 3 輸出軸咬合
  const engage = P.shaftLen - P.plateT - 0.5;
  const overhang = (L.trackCx) - (L.hw + P.shaftLen);
  add('機構干涉', '輸出軸插入驅動輪深度', engage < 4 ? 'fail' : engage < 6 ? 'warn' : 'pass', `${fx(engage)} mm`,
    `軸突出 12.5 − 側壁 ${P.plateT} − 間隙 0.5。D 形孔＋M3 止付螺絲固定。履帶中心在軸端外 ${fx(overhang)} mm（懸臂），${overhang > 10 ? '偏大，建議縮窄履帶或減少側壁厚。' : '在可接受範圍。'}前端凸台尺寸待量測，凸台若比側壁孔大會吃掉咬合長度。`, ['sprL', 'sprR', 'motorL', 'motorR']);

  // 4 下層擺放：驅動板、電源區、立柱、托架、馬達插頭
  const pw = L.pwr;
  const lower = [['DRV8870', L.drv.box], ['CH224K', pw.pd], ['Mini560', pw.buck], ['AMS1117', pw.ldo], ['C1', pw.cap],
    ...L.pillars.map((p, i) => [`立柱 ${i + 1}`, p]), ...(L.bay ? [['托盤小立柱', L.trayPost]] : []), ...L.cradles.map(c => ['馬達托架', c])];
  const movers = [['左馬達', mL], ['右馬達', mR], ['左馬達 6P 插頭', L.mL.connBox], ['右馬達 6P 插頭', L.mR_.connBox]];
  const hitsL = [];
  for (let i = 0; i < lower.length; i++) {
    for (let j = i + 1; j < lower.length; j++) if (overlap(lower[i][1], lower[j][1]).hit) hitsL.push(`${lower[i][0]}／${lower[j][0]}`);
    for (const [n, b] of movers) if (overlap(lower[i][1], b).hit) hitsL.push(`${lower[i][0]}／${n}`);
  }
  const trayGap = L.trayY0 - (L.axleY + L.mR);
  add('機構干涉', '下層：驅動板、電源區、立柱', hitsL.length ? 'fail' : 'pass', hitsL.length ? `撞到 ${hitsL.slice(0, 3).join('、')}` : `托盤離馬達頂 ${fx(trayGap)} mm`,
    hitsL.length ? '下層零件互相重疊，請調整內寬或驅動板位置。' : `DRV8870 在右側（端子朝中央、VM 在後），右${pw.front ? '前' : '後'}角是電源區（CH224K、Mini560、AMS1117），C1 躺在 VM 端子旁。馬達 6P 接頭水平朝車身中央，不會頂到上面的托盤。四根立柱讓上身鎖在底盤上，也決定電池艙寬度。`,
    ['driver', 'pd', 'buck', 'ldo', 'cap', 'motorL', 'motorR', 'tub']);

  // 5 驅動板杜邦頭上方
  const hdrInCh = L.drv.hdrX >= L.chX0 && L.drv.hdrX <= L.chX1;
  const room = (hdrInCh ? L.deckY0 : Math.min(L.trayY0, L.deckY0)) - L.drv.hdrTop;
  add('機構干涉', 'DRV8870 杜邦頭上方彎線空間', room < 4 ? 'fail' : room < 8 ? 'warn' : 'pass', `${fx(room)} mm`,
    hdrInCh ? '排針那一長邊剛好在右側線材通道正下方，通道從地板通到上身，杜邦線可以直接往上彎進通道接 J2。' : '排針上方被托盤蓋住，杜邦線沒地方彎。', ['driver']);

  // 6 上身線孔
  const hz = L.deckHole;
  const holeOk = hz.x0 >= -L.inW + 0.5 && hz.x1 <= L.inW - 0.5 && hz.x0 >= -L.wingX0 && hz.z0 >= L.inZ0 && hz.z1 <= L.inZ1;
  add('機構干涉', '上身線孔對準通道', holeOk ? 'pass' : 'warn', holeOk ? '在身體內' : '落在身體外',
    holeOk ? `上身底板右後方 ${fx(hz.x1 - hz.x0, 0)} × ${fx(hz.z1 - hz.z0, 0)} 長孔在通道正上方、右翼內側，J1／J2 從這裡上來。` : '底盤比身體寬，線孔落在外殼外面，需要另外做線槽蓋。', ['frame', 'conn']);

  // 電池艙
  const B = L.bank;
  const cmpLayout = mount => {           // 另一種擺法、總高相同時的穩定性（比較用）
    const P0 = { ...P, bankMount: mount };
    const P1 = { ...P0, bodyH: P.bodyH - (computeLayout(P0).bodyY1 - L.bodyY1) };
    const L1 = computeLayout(P1);
    return stability(P1, L1, 0);
  };
  if (L.bay) {
    const wAvail = L.bayX1 - L.bayX0, tAvail = P.bayH - 0.5;
    const fitW = P.bankW <= wAvail, fitT = P.bankT <= tAvail;
    add('電池艙', '行動電源放得進電池艙', fitW && fitT ? 'pass' : 'fail', `${fx(P.bankW, 0)}×${fx(P.bankT, 1)}／可用 ${fx(wAvail, 0)}×${fx(tAvail, 1)}`,
      fitW && fitT ? `寬度還剩 ${fx(wAvail - P.bankW, 0)} mm、厚度還剩 ${fx(tAvail - P.bankT, 1)} mm。${tAvail - P.bankT > 6 ? '比較薄：魔鬼氈要拉緊，或在上面墊一片泡棉。' : ''}`
        : (!fitT ? `太厚了。「電池艙高度」要加到 ${Math.ceil(P.bankT + 0.5)} mm（整台車會跟著變高），或換一顆薄一點的。` : `太寬了。寬度上限是兩側立柱之間的 ${fx(wAvail, 0)} mm，請換一顆窄一點的。`), ['bank', 'tray']);
    const corners = [[L.tubZ0, P.floorY], [Math.min(B.z0, L.tubZ0), L.trayTop]];
    const Cz = -L.zS, Cy = L.axleY, r = L.axleY;      // 車尾履帶繞輪外緣（貼地）
    const dep = Math.min(...corners.map(([z, y]) => { const u = Cz - z, v = y - Cy, dd = Math.hypot(u, v); return dd <= r ? 0 : (Math.atan2(v, u) + Math.asin(r / dd)) / D2R; }));
    const p = B.protrude;
    add('電池艙', '尾巴露出與離去角', dep < 20 ? 'fail' : (dep < 30 || p > 40) ? 'warn' : 'pass', `露出 ${fx(p, 0)} mm／離去角 ${fx(dep, 0)}°`,
      `電池艙長 ${fx(L.bayZ1 - L.tubZ0, 0)} mm，後面整個打開，比較長的行動電源直接從車尾露出來。離去角是倒車下坡時車尾不會先撞地的最大坡度，營隊坡道 ≤ 20° 就夠。${p > 20 ? '露出的部分倒車時會先撞到牆。' : ''}`, ['bank', 'tray', 'trackL', 'trackR']);
    const mb = P.bankMass;
    const zbIdeal = -(st.mass * st.cg.z - mb * B.z) / mb;
    const spMax = Math.max(0, (L.bayZ1 - L.tubZ0) - P.bankL);
    const spIdeal = clamp(L.bayZ1 - P.bankL / 2 - zbIdeal, 0, spMax);
    const worstA = Math.min(st.aFront, st.aRear);
    const sugg = Math.abs(spIdeal - P.bankSpacer) >= 5 ? `建議前方墊塊 ≈ ${fx(Math.round(spIdeal / 5) * 5, 0)} mm（可以疊 10 mm 的墊片）。` : '目前位置已經接近最佳。';
    add('電池艙', '行動電源前後位置（配重）', worstA < st.aTraction ? 'warn' : 'pass', `重心${st.cg.z >= 0 ? '偏前' : '偏後'} ${fx(Math.abs(st.cg.z))} mm`,
      `行動電源頂著前壁放${P.bankSpacer > 0 ? `（前面墊 ${P.bankSpacer} mm）` : ''}，中心在 z = ${fx(B.z, 0)}。${sugg}重心越接近兩軸中間，急煞前翻與急加速後仰的餘裕越平均。`, ['bank', 'spacer']);
    if (!L.strapZ.length) add('電池艙', '魔鬼氈綁得到', 'warn', '綁帶扣孔不在行動電源範圍內', '行動電源太短，前後兩組扣孔都碰不到；在前面加墊塊或用彈性繩。', ['bank', 'tray']);
    const sb = cmpLayout('back');
    add('電池艙', '為什麼不掛在外面', 'info', `背後 ${fx(sb.cg.y, 0)} mm vs 艙內 ${fx(st.cg.y, 0)} mm`,
      `同一顆行動電源、總高相同：掛在身體背後重心會升高 ${fx(sb.cg.y - st.cg.y, 0)} mm、往後移 ${fx(st.cg.z - sb.cg.z, 0)} mm，後仰門檻從 ${fx(st.aRear, 1)} 掉到 ${fx(sb.aRear, 1)} m/s²（履帶抓地 ${fx(st.aTraction, 1)}${sb.aRear < st.aTraction ? '，猛加速就會往後翻' : ''}）。放在馬達正上方，行動電源本身就是最好的配重。到「參數 → 行動電源」切換「掛背後」可以直接看。`, ['bank']);
  } else {
    const sd = cmpLayout('deck');
    add('電池艙', '行動電源掛在背後（比較）', st.aRear < st.aTraction ? 'fail' : 'warn', `重心 ${fx(st.cg.y, 0)} mm（艙內 ${fx(sd.cg.y, 0)}）`,
      `掛背後重心升高 ${fx(st.cg.y - sd.cg.y, 0)} mm、往後移 ${fx(sd.cg.z - st.cg.z, 0)} mm。後仰門檻 ${fx(st.aRear, 1)} m/s²（放電池艙 ${fx(sd.aRear, 1)}），履帶抓地 ${fx(st.aTraction, 1)}：${st.aRear < st.aTraction ? '猛加速或爬坡時會往後翻。' : '還不會翻，但餘裕變小。'}另外背包擋住外殼拆裝、線要繞一大圈。建議放回電池艙。`, ['bank', 'backpack']);
  }

  // 7 離地間隙
  add('機構干涉', '離地間隙', L.clearance < 6 ? 'fail' : L.clearance < 10 ? 'warn' : 'info', `${fx(L.clearance)} mm`,
    `由履帶輪半徑決定（軸高 ${fx(L.axleY)} − 馬達半徑 ${fx(L.mR)}）。室內場地、紙箱坡道 OK，碎石地容易卡底。`, ['tub', 'motorL', 'motorR']);

  // 8 履帶片數
  const resid = (L.links - L.linksExact) * P.trackPitch;
  const idlerMove = resid / 2;
  add('機構干涉', '履帶片數整數化', Math.abs(idlerMove) <= 4 ? 'pass' : 'warn', `${L.links} 片（理論 ${fx(L.linksExact, 2)}）`,
    `惰輪需${idlerMove >= 0 ? '往外' : '往內'}移 ${fx(Math.abs(idlerMove))} mm，張緊槽 ±4 mm ${Math.abs(idlerMove) <= 4 ? '可以吸收' : '不夠，請調整軸距'}。`, ['trackL', 'trackR', 'idlL', 'idlR']);

  // 9 伺服機在身體內
  const sb = L.servoBox;
  const spkBox = { x0: -L.spk.r, x1: L.spk.r, y0: L.spk.y - L.spk.r, y1: L.spk.y + L.spk.r, z0: L.spineZ1, z1: L.spk.zF };
  const perfBox = { x0: L.perf.x0, x1: L.perf.x1, y0: L.perf.y0, y1: L.perf.y1, z0: L.perf.z0, z1: L.perf.z1 };
  const spineBox = { x0: -L.wingX1, x1: L.wingX1, y0: L.bodyY0, y1: L.frameTop, z0: L.spineZ0, z1: L.spineZ1 };
  const swBox = { x0: L.sw.x - 7.5, x1: L.sw.x + 7.5, y0: L.sw.y0, y1: L.sw.y1, z0: L.sw.z - 10.5, z1: L.sw.z + 10.5 };
  const sHits = [['喇叭', spkBox], ['配電板', perfBox], ['骨架', spineBox], ['開關', swBox]].filter(([, b]) => overlap(sb, b).hit).map(([n]) => n);
  add('機構干涉', 'SG92R 與身體內部元件', sHits.length ? 'fail' : 'pass', sHits.length ? `撞到 ${sHits.join('、')}` : '無干涉',
    '伺服機倒吊在頂板下方，耳片鎖在頂板底面。', ['servo', 'topPlate']);
  const others = [['配電板', perfBox], ['開關', swBox]];
  const bodyInner = { x0: -L.inW, x1: L.inW, y0: L.bodyY0, y1: L.bodyY1, z0: L.inZ0, z1: L.inZ1 };
  const outside = others.filter(([, b]) => b.x0 < bodyInner.x0 - 0.01 || b.x1 > bodyInner.x1 + 0.01 || b.z0 < bodyInner.z0 - 0.01 || b.z1 > bodyInner.z1 + 0.01 || b.y0 < bodyInner.y0 - 0.01 || (b !== swBox && b.y1 > L.topY0 + 0.01)).map(([n]) => n);
  const spkOk = L.spk.zB >= L.spineZ1 - 0.01;
  const pairHit = overlap(perfBox, swBox).hit || overlap(perfBox, spineBox).hit;
  add('機構干涉', '身體內部模組擺放', (outside.length || !spkOk || pairHit) ? 'fail' : 'pass',
    (outside.length || !spkOk || pairHit) ? '空間不足' : 'OK',
    !spkOk ? '身體太淺，喇叭會撞到骨架，請加深身體。' : outside.length ? `${outside.join('、')} 超出外殼或撞到頂板。` : pairHit ? '配電板與開關或骨架重疊。' : '喇叭貼前格柵、功放在旁、配電板在右翼，後方留給線束。降壓模組已經搬到底盤電源區，身體可以縮短。',
    ['speaker', 'amp', 'perf', 'switch']);

  // 10 頭部旋轉掃掠
  const hr = Math.hypot(P.headW / 2, Math.max(Math.abs(L.head.z0), Math.abs(L.head.z1)));
  const swR = Math.hypot(L.sw.x, L.sw.z - P.neckZ) - 11;
  const headBottom = L.pivotY;
  const swTop = L.sw.y1 + 9;
  const bodyGap = headBottom - L.bodyY1;
  const swClash = swR < hr && swTop > headBottom;
  add('頭部與配線', '頭部 ±' + P.yawMax + '° 旋轉掃掠', swClash || bodyGap < 1 ? 'fail' : 'pass', `頭底離身體頂 ${fx(bodyGap)} mm`,
    `頭部掃掠半徑 ${fx(hr)} mm。頂板上的開關按鈕高度 ${fx(swTop - L.topY1)} mm，低於頭部底面，轉頭不會掃到。`, ['headHood', 'headFloor', 'switch']);

  // 11 頸部線束窗口
  const angNeed = P.yawMax + Math.asin(L.bundleR / L.harnessR) / D2R;
  const angAvail = Math.acos(-L.windowZ / L.harnessR) / D2R;
  const margin = angAvail - angNeed;
  add('頭部與配線', '頸部線束通過窗口', margin < 0 ? 'fail' : margin < 3 ? 'warn' : 'pass', `餘裕 ${fx(margin)}°`,
    `線束在轉軸後方 ${L.harnessR} mm 處穿過頭部底盤（Ø8 孔）。轉到 ±${P.yawMax}° 時線束邊緣在 ${fx(angNeed)}°，頂板腎形窗口可用到 ${fx(angAvail)}°。機械限位 ±${L.stopAng}°。`, ['topPlate', 'headFloor']);

  // 12 頭內 PCB
  const innerW = P.headW - 2 * L.head.wall;
  const needW = ESP.l + ESP.antOver + 2 * 1.5;
  const pcbVert = ESP.w * Math.cos(P.camTilt * D2R) + (ESP.t + P.lensH) * Math.sin(P.camTilt * D2R);
  const innerH = P.headH - L.head.floorT - L.head.wall;
  const depthAvail = L.head.lensFrontZ - L.head.backInnerZ;
  const fits = innerW >= needW && innerH >= pcbVert + 6 && depthAvail >= L.head.stackDepth;
  add('頭部與配線', 'ESP32-S3-CAM 放進頭殼', fits ? (depthAvail - L.head.stackDepth < 3 ? 'warn' : 'pass') : 'fail',
    `深度餘裕 ${fx(depthAvail - L.head.stackDepth)} mm`,
    `內寬 ${fx(innerW)} / 需要 ${fx(needW)}；內高 ${fx(innerH)} / PCB 投影 ${fx(pcbVert)}＋線 6；深度 ${fx(depthAvail)} / 鏡頭 ${P.lensH}＋PCB＋排針 ${ESP.pinLen}＋杜邦 ${ESP.dupont}＋彎線 ${ESP.bend}。排針方向與長度待量測。`, ['esp32', 'headHood']);

  // 13 USB
  const eyeFit = L.head.eyeX + 14 <= P.headW / 2 - L.head.wall;
  add('頭部與配線', '真鏡頭與眼睛對位', eyeFit ? 'pass' : 'fail', L.head.camEye ? (L.head.camEye < 0 ? '鏡頭在右眼' : '鏡頭在左眼') : '鏡頭在兩眼中間',
    eyeFit ? (L.head.camEye ? `鏡頭偏離 PCB 中心 ${fx(Math.abs(P.lensOffset))} mm，剛好當一隻眼睛；另一隻是印出來的造型眼。相機是軟排線接的，差幾 mm 可以直接挪相機模組對齊眼圈。` : '鏡頭在中間，兩隻眼睛都是造型，真鏡頭藏在護目鏡中間。') : '眼圈超出頭殼，請加寬頭部或調整鏡頭位置。', ['headHood', 'esp32']);
  add('頭部與配線', 'USB-C 燒錄插線', 'pass', '頭部左側開孔',
    'OTG 與 TTL 兩個 USB-C 都在 PCB 同一端，朝頭部左側開 8×20 mm 孔。請用 TTL 口燒錄（CH340 自動重置，最穩），OTG 腳位 GPIO19/20 拿去接編碼器。插 USB 時請關電池開關（5V 已加 SS34 防逆流）。', ['esp32', 'headHood']);

  // 14 鏡頭視野
  const o0 = fovOcclusion(P, L, 0), o1 = fovOcclusion(P, L, P.yawMax * D2R);
  const occMax = Math.max(o0.occ, o1.occ);
  add('頭部與配線', '鏡頭視野被車身遮擋', occMax > 0.2 ? 'warn' : 'pass', `正前 ${fx(o0.occ * 100, 0)}%／轉 ${P.yawMax}° ${fx(o1.occ * 100, 0)}%`,
    `垂直視角約 ${fx(o0.vfov, 0)}°、俯角 ${P.camTilt}°。正前方地面最近可看到 ${isFinite(o0.groundNear) ? fx(o0.groundNear, 0) + ' mm' : '看不到地面'}。遮擋比例是畫面下緣被身體頂板擋住的高度比例。`, ['esp32', 'shell']);

  // 15 麥克風距離
  const micP = st.items.find(i => i.id === 'mic').p;
  const spkP = new THREE.Vector3(0, L.spk.y, L.spk.zF);
  const dSpk = micP.distanceTo(spkP);
  const dMot = Math.min(micP.distanceTo(st.items.find(i => i.id === 'motorL').p), micP.distanceTo(st.items.find(i => i.id === 'motorR').p));
  add('頭部與配線', '麥克風遠離喇叭與馬達', dSpk < 80 || dMot < 100 ? 'warn' : 'pass', `喇叭 ${fx(dSpk, 0)} mm／馬達 ${fx(dMot, 0)} mm`,
    P.micInHead ? 'INMP441 放在頭頂內側，和喇叭隔著伺服機，機構上也不共振。' : '放在身體上後方，與喇叭共用外殼，容易收到喇叭振動，建議改放頭部。', ['mic', 'speaker']);

  // 16 穩定性
  const worst = Math.min(st.aFront, st.aRear);
  const fwd = st.aFront < st.aRear;
  add('穩定性', '急煞／急加速前後翻覆', worst < st.aTraction ? 'warn' : 'pass', `翻覆門檻 ${fx(worst)} m/s²（${fwd ? '前翻' : '後仰'}先到）`,
    `重心高 ${fx(st.cg.y)} mm、${st.cg.z >= 0 ? '偏前' : '偏後'} ${fx(Math.abs(st.cg.z))} mm。急煞前翻門檻 ${fx(st.aFront, 1)}、急加速後仰門檻 ${fx(st.aRear, 1)} m/s²；履帶最大抓地 μg ≈ ${fx(st.aTraction)} m/s²。${worst < st.aTraction ? (fwd ? '抓地力大於翻覆門檻，硬煞車可能前翻！' : '抓地力大於翻覆門檻，猛加速可能往後翻！') : '抓地力先打滑，理論上不會翻。'}韌體建議加速度限制 ${fx(st.aRamp, 1)} m/s²（約 0.3 s 從 0 加速到 ${fx(st.aRamp * 0.3, 2)} m/s）。`, ['bank', 'motorL', 'motorR']);
  add('穩定性', '轉彎側翻', st.aSide < st.aTraction ? 'warn' : 'pass', `側翻角 ${fx(st.sideDeg)}°`,
    `履帶外緣半寬 ${fx(L.trackOut)} mm，重心高 ${fx(st.cg.y)} mm。側向要 ${fx(st.aSide)} m/s² 才翻，原地旋轉遠小於這個值。`, ['trackL', 'trackR']);
  add('穩定性', '爬坡／下坡', Math.min(st.frontDeg, st.rearDeg) < st.slideDeg ? 'warn' : 'pass', `翻覆 ${fx(Math.min(st.frontDeg, st.rearDeg))}° / 打滑 ${fx(st.slideDeg)}°`,
    '坡度超過打滑角會先滑下來，翻覆角比打滑角大代表安全。建議營隊坡道 ≤ 20°。', []);

  // 17 伺服負載
  const headItems = st.items.filter(i => ['headFloor', 'headHood', 'headBack', 'esp32', 'wiresH'].includes(i.id) || (i.id === 'mic' && P.micInHead));
  const hm = headItems.reduce((s, i) => s + i.m, 0) / 1000;
  const I = hm * ((P.headW / 1000) ** 2 + (P.headD / 1000) ** 2) / 12 + hm * (P.headZ / 1000) ** 2;
  const alpha = 4 * (60 * D2R) / (0.1 ** 2);
  const need = I * alpha, torque = 0.245;
  add('穩定性', 'SG92R 轉頭扭力', need > torque * 0.5 ? 'warn' : 'pass', `安全係數 ${fx(torque / need, 0)}×`,
    `頭部 ${fx(hm * 1000, 0)} g，轉動慣量 ${fx(I * 1e6, 1)} kg·mm²。以 0.1 s/60° 全速啟停估算需要 ${fx(need * 1000, 1)} mN·m，SG92R 約 245 mN·m（4.8 V）。側向力由頸座軸環承受，不壓在伺服軸上。`, ['servo', 'headFloor']);

  // 18 電源（PD 行動電源 → CH224K 9 V）
  const iLim = 1.25, duty = 0.66;
  const wWorst = 2 * duty * iLim * 9 + 1.8 * 5 / 0.88;
  add('電源與腳位', 'CH224K 輸出電壓', 'warn', '上車前先量到 9.0 V',
    '很多 CH224K 誘騙板出廠預設 20 V 或 12 V，要用板上的跳線／電阻／撥碼設成 9 V。第一次先單獨接行動電源，用三用電表量到 9.0 V 才接上車。（板子的設定方式待拍照確認）', ['pd']);
  add('電源與腳位', 'PD 沒成功時只有 5 V', 'warn', 'GPIO1 監測 9 V',
    '行動電源不支援 PD、或用了 A-to-C 線時，CH224K 只會輸出 5 V：DRV8870 要 ≥ 6.5 V 才會動，Mini560 的 5 V 也會掉。韌體用 GPIO1 量 9 V 匯流排，低於 7 V 就停車、亮紅燈、序列埠提示「PD 沒成功」。', ['pd', 'bank']);
  add('電源與腳位', '20 W 功率預算', wWorst > 20 ? 'warn' : 'pass', `平常 ≈ ${fx(AVG_W, 0)} W／最壞 ≈ ${fx(wWorst, 0)} W`,
    `20 W 行動電源在 9 V 最多 2.2 A。最壞情況是兩顆馬達同時堵轉（驅動板限流 ${iLim} A × PWM ${duty * 100}%）＋伺服堵轉＋喇叭大聲。韌體堵轉保護：PWM > 30% 但編碼器 0.3 s 沒有脈衝就斷電，就不會撞到上限。`, ['bank', 'driver']);
  add('電源與腳位', '行動電源自動關機', 'warn', '待機電流不要太低',
    '很多行動電源輸出低於約 50–100 mA 會在 30 秒內自動關機。ESP32＋相機平常約 0.15–0.25 A（5 V），換算 9 V 端約 0.1 A，勉強在門檻上。韌體不要用 deep sleep；真的被關掉就按一下行動電源按鈕。', ['bank']);
  add('電源與腳位', 'DRV8870 的 VO 與限流', 'warn', 'VO 不接；可變電阻轉最小',
    '這塊模組的 VO 很可能就是 DRV8870 的 VREF：R100（0.1 Ω）取樣下限流 ≈ VO ÷ 1 Ω，LM317M 最低 1.25 V → 最低限流約 1.25 A。可變電阻轉到最小就是最安全的設定，VO 不要拿去接任何東西。（待量測：板子回來後量 VO 是否從 1.25 V 起跳）', ['driver']);
  add('電源與腳位', '6 V 馬達接 9 V', 'warn', `PWM 上限 ${duty * 100}%`,
    `平均電壓 9 × ${duty} ≈ 6 V。韌體 MOTOR_MAX = ${duty}、0.25 s 軟啟動。不要把上限拿掉，馬達會過熱、碳刷壽命變短。`, ['motorL', 'motorR', 'driver']);
  add('電源與腳位', '編碼器電壓', 'pass', '3.3 V（AMS1117）',
    'ESP32-S3 的 GPIO 不耐 5 V。兩顆編碼器的 VCC 由 Mini560 的 5 V 經 AMS1117-3.3 供應（不用驅動板 VO），每條訊號線串 1 kΩ。', ['ldo', 'motorL', 'motorR']);
  add('電源與腳位', '5 V 電流預算', 'pass', '峰值約 1.8 A',
    'ESP32-S3＋相機＋Wi-Fi 約 0.5 A 峰值、SG92R 堵轉約 0.65 A、MAX98357A 3 W 峰值約 0.65 A。Mini560 標示 5 A（實際連續電流待確認）。伺服與功放旁各加 470 µF。', ['buck', 'perf']);
  add('電源與腳位', '續航（估）', 'info', `約 ${fx(runtimeH(P), 1)} 小時`,
    `${P.bankCap} mAh × 3.7 V × 85% 轉換效率 ÷ 平均 ${AVG_W} W。一直原地打轉或喇叭大聲會短很多。`, ['bank']);
  add('電源與腳位', 'GPIO 數量（含編碼器）', 'pass', '用 12＋選配 2／可用 14',
    '依 GOOUUU 排針：相機佔 4–13、15–18，35/36/37 雖然有拉出來但被 Octal PSRAM 佔用。馬達 4、伺服 1、I2S 4（麥克風與功放共用 BCLK/WS）、9 V 監測 1、編碼器 A 相 2（GPIO19/20，改用 TTL 口燒錄）。編碼器 B 相選配 GPIO3/46（46 會影響燒錄模式）。', ['esp32']);

  // 19 列印尺寸
  const bed = P.bed;
  const printParts = [
    ['底盤槽', L.tubLen, P.innerW + 2 * P.plateT, L.deckY0 - P.floorY],
    ...(L.bay ? [['電池艙托盤', L.tubLen, L.hw - L.lipX0, L.trayT + 8]] : []),
    ['上身骨架', L.tubLen, P.innerW + 2 * P.plateT, L.frameTop - L.deckY0],
    ['身體外殼', P.bodyW, P.bodyD, P.bodyH],
    ['頂板／頸座', 2 * L.inW, L.inZ1 - L.inZ0, L.topT + 7 + L.riserH],
    ['頭罩', P.headW, P.headD, P.headH - 3],
  ];
  const tooBig = printParts.filter(([, a, b, c]) => Math.max(a, b) > bed - 4 || c > bed - 4).map(([n]) => n);
  add('製造', `列印平台 ${bed}×${bed} mm`, tooBig.length ? 'fail' : 'pass', tooBig.length ? `${tooBig.join('、')} 放不下` : '全部零件可單件列印',
    printParts.map(([n, a, b, c]) => `${n} ${fx(a, 0)}×${fx(b, 0)}×${fx(c, 0)}`).join('；'), []);
  return { list: C, st };
}

function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: o.r ?? 0.62, metalness: o.m ?? 0.04, transparent: !!o.t, opacity: o.op ?? 1, side: o.side ?? THREE.FrontSide });
}
function mesh(geo, material) { const m = new THREE.Mesh(geo, material); m.castShadow = true; m.receiveShadow = true; return m; }
function boxB(x0, x1, y0, y1, z0, z1, material) {
  const m = mesh(new THREE.BoxGeometry(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0)), material);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); return m;
}
function cylX(r, x0, x1, y, z, material, seg = 32) { const m = mesh(new THREE.CylinderGeometry(r, r, Math.abs(x1 - x0), seg), material); m.rotation.z = Math.PI / 2; m.position.set((x0 + x1) / 2, y, z); return m; }

function cylZ(r, z0, z1, x, y, material, seg = 32) { const m = mesh(new THREE.CylinderGeometry(r, r, Math.abs(z1 - z0), seg), material); m.rotation.x = Math.PI / 2; m.position.set(x, y, (z0 + z1) / 2); return m; }
const V2 = (a, b) => new THREE.Vector2(a, b);
function shapeFrom(pts, holes, map) {

  return s;
}

  const m = mesh(g, material); m.rotation.x = -Math.PI / 2; m.position.y = y0; return m;
}
function plateZY(outline, holes, x0, t, material) {
  const g = new THREE.ExtrudeGeometry(shapeFrom(outline, holes, ([z, y]) => V2(-z, y)), { depth: t, bevelEnabled: false, curveSegments: 20 });
  const m = mesh(g, material); m.rotation.y = Math.PI / 2; m.position.x = x0; return m;
}
function plateXY(outline, holes, z0, t, material) {
  const g = new THREE.ExtrudeGeometry(shapeFrom(outline, holes, ([x, y]) => V2(x, y)), { depth: t, bevelEnabled: false, curveSegments: 20 });
  const m = mesh(g, material); m.position.z = z0; return m;
}
function rrect(a0, b0, a1, b1, r, seg = 5) {
  r = Math.min(r, Math.abs(a1 - a0) / 2 - 0.01, Math.abs(b1 - b0) / 2 - 0.01);
  const pts = []; const cs = [[a1 - r, b1 - r, 0], [a0 + r, b1 - r, 90], [a0 + r, b0 + r, 180], [a1 - r, b0 + r, 270]];
  for (const [ca, cb, st] of cs) for (let i = 0; i <= seg; i++) { const t = (st + 90 * i / seg) * D2R; pts.push([ca + r * Math.cos(t), cb + r * Math.sin(t)]); }

}
function circ(ca, cb, r, n = 28) { const p = []; for (let i = 0; i < n; i++) { const t = i / n * Math.PI * 2; p.push([ca + r * Math.cos(t), cb + r * Math.sin(t)]); } return p; }

  const pts = [];
  const n = Math.max(8, Math.round((a1 - a0) / 6));
  if (a1 - a0 >= 359.9) {
    return plateXZ(circ(x, z, r1, 48), [circ(x, z, r0, 48)], y0, y1 - y0, material);
  }
  for (let i = 0; i <= n; i++) { const t = (a0 + (a1 - a0) * i / n) * D2R; pts.push([x + r1 * Math.sin(t), z + r1 * Math.cos(t)]); }
  for (let i = n; i >= 0; i--) { const t = (a0 + (a1 - a0) * i / n) * D2R; pts.push([x + r0 * Math.sin(t), z + r0 * Math.cos(t)]); }

}

function buildChassis() {

  // 底板（馬達下方開槽）
  const holes = [];
  for (const mo of [L.mL, L.mR_]) {
    const xa = Math.min(mo.flangeX, mo.innerX) - 1, xb = Math.max(mo.flangeX, mo.innerX) + 1;
    holes.push(rrect(Math.max(xa, -L.hw + 0.5), mo.z - 9, Math.min(xb, L.hw - 0.5), mo.z + 9, 3));
  }
  t.add(plateXZ(rrect(-xo, z0, xo, z1, 6), holes, P.floorY, P.floorT, mPrint));
  // 側壁（兼馬達座）：馬達軸孔、2×M3（左右排列）、惰輪長槽
  const wallOutline = rrect(z0, P.floorY, z1, L.deckY0, 6);
  for (const mo of [L.mL, L.mR_]) {
    const sx = mo.sign > 0 ? L.hw : -L.hw - P.plateT;
    const idz = -mo.z;
    const hs = [circ(mo.z, L.axleY, 4.2, 20), circ(mo.z + P.motorHole / 2, L.axleY, 1.7, 12), circ(mo.z - P.motorHole / 2, L.axleY, 1.7, 12),
      rrect(idz - 4 - 2.2, L.axleY - 2.2, idz + 4 + 2.2, L.axleY + 2.2, 2.1)];
    t.add(plateZY(wallOutline, hs, sx, P.plateT, mPrint));
  }
  // 前後壁：後壁上半部是電池艙開口，下半部是 CH224K 的 USB-C 孔
  const wy0 = L.floorTop, wy1 = L.deckY0;
  const usbHole = rrect(pw.usbX - 6.75, L.usbY - 3.8, pw.usbX + 6.75, L.usbY + 3.8, 2.5);
  const rearOut = L.bay ? [[-L.hw, wy0], [L.hw, wy0], [L.hw, wy1], [L.bayX1, wy1], [L.bayX1, L.trayY0], [L.lipX0, L.trayY0], [L.lipX0, wy1], [-L.hw, wy1]] : rrect(-L.hw, wy0, L.hw, wy1, 1);
  const my = (wy0 + Math.min(L.trayY0, wy1)) / 2;
  const frontHoles = [circ(-20, my, 1.7, 12), circ(20, my, 1.7, 12)], rearHoles = [];
  (pw.front ? frontHoles : rearHoles).push(usbHole);
  t.add(plateXY(rearOut, rearHoles, z0, E, mPrint));
  t.add(plateXY(rrect(-L.hw, wy0, L.hw, wy1, 1), frontHoles, z1 - E, E, mPrint));
  // 上身固定立柱（頂端 M3 熱熔螺母）
  for (const p of L.pillars) {
    t.add(boxB(p.x0, p.x1, p.y0, p.y1, p.z0, p.z1, mPrintDk));
    t.add(cylY(2.1, p.y1 - 0.2, p.y1 + 0.05, (p.x0 + p.x1) / 2, (p.z0 + p.z1) / 2, mBrass, 14));
  }
  if (L.bay) {
    // 托盤支撐：左壁凸緣（避開左後馬達）、前壁凸緣、通道邊小立柱；後壁開口下緣也撐著托盤
    t.add(boxB(L.hw - 3, L.hw, L.trayY0 - 2.5, L.trayY0, L.mL.box.z1 + 1, z1 - E, mPrintDk));
    t.add(boxB(L.lipX0, L.hw, L.trayY0 - 2.5, L.trayY0, z1 - E - 6, z1 - E, mPrintDk));
    const tp = L.trayPost; t.add(boxB(tp.x0, tp.x1, tp.y0, tp.y1, tp.z0, tp.z1, mPrintDk));
  }
  // 馬達尾端托架：跨在底板槽兩側的立柱，束線帶繞過馬達
  for (const c of L.cradles) t.add(boxB(c.x0, c.x1, c.y0, c.y1, c.z0, c.z1, mPrintDk));
  for (const mo of [L.mL, L.mR_]) { const cx = mo.innerX + mo.sign * (P.encLen + 6); t.add(cylX(L.mR + 0.6, cx - 1.6, cx + 1.6, L.axleY, mo.z, mat(0xf2f2f2), 24)); }
  // 驅動板螺絲座、電源模組底座
  const d = L.drv;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) t.add(cylY(3.25, L.floorTop, d.y0, d.x + sx * d.hole[0], d.z + sz * d.hole[1], mPrintDk, 16));
  const pd = pw.pd, ra = Math.max(pd.z0, z0 + E), rb = Math.min(pd.z1, z1 - E);
  for (const xx of [pd.x0 + 1.5, pd.x1 - 1.5]) t.add(boxB(xx - 1, xx + 1, L.floorTop, pd.y0, ra, rb, mPrintDk));
  for (const m of [pw.buck, pw.ldo]) for (const zz of [m.z0 + 3, m.z1 - 3]) t.add(cylY(1.8, L.floorTop, m.y0, (m.x0 + m.x1) / 2, zz, mPrintDk, 12));

  // 馬達
  for (const mo of [L.mL, L.mR_]) {
    const g = part(mo.side === 'L' ? 'motorL' : 'motorR');
    const s = mo.sign;
    const xA = mo.flangeX, xB = xA - s * P.gearLen, xC = xB - s * P.motorCan, xD = xC - s * P.encLen;
    g.add(cylX(L.mR, xA, xB, L.axleY, mo.z, mat(COL.gear, { m: 0.55, r: 0.4 })));
    g.add(cylX(L.mR, xB, xC, L.axleY, mo.z, mat(COL.metal, { m: 0.7, r: 0.3 })));
    g.add(cylX(L.mR, xC, xD, L.axleY, mo.z, mat(COL.dark)));
    g.add(cylX(P.shaftD / 2, xA, xA + s * P.shaftLen, L.axleY, mo.z, mat(0xd9dde0, { m: 0.8, r: 0.25 }), 16));
    g.add(cylX(3.5, xA, xA + s * 2.5, L.axleY, mo.z, mat(0xc98b5a, { m: 0.6, r: 0.35 }), 20));   // Ø7 銅套凸台（高 2.5）
    const fz = mo.fz;
    g.add(boxB(xD + s * 1.5, xD + s * 9.5, L.axleY - 4.5, L.axleY + 4.5, mo.z + fz * (L.mR - 1.5), mo.z + fz * (L.mR + 3.5), mat(0xf2f2f2)));   // 6P 編碼器接頭，水平朝車身中央
    g.add(boxB(xD + s * 2, xD + s * 9, L.axleY - 3.5, L.axleY + 3.5, mo.z + fz * (L.mR + 3.5), mo.z + fz * (L.mR + 6), mat(0xe8e2c8)));        // 插頭
    for (const dz of [-P.motorHole / 2, P.motorHole / 2]) g.add(cylX(2.8, xA + s * (P.plateT - 2), xA + s * (P.plateT - 0.35), L.axleY, mo.z + dz, mat(0x5b6066, { m: 0.6 }), 12));
  }

  // 輪子
  for (const w of L.wheels) {
    const g = part(w.id);
    const s = Math.sign(w.x);
    const xin = s * (L.wallOut + 0.5), xout = s * L.trackOut;
    const col = w.drive ? mat(COL.shellAccent) : mat(0x9a6a4a);
    const rim = L.R - P.trackT / 2 - 0.5;
    g.add(cylX(rim, s * L.trackX0, xout, L.axleY, w.z, col, 40));
    g.add(cylX(6, xin, s * L.trackX0, L.axleY, w.z, col, 20));
    const toothM = mat(w.drive ? 0xa84e22 : 0x7e5638);
    for (let i = 0; i < P.sprocketTeeth; i++) {
      const a = (i + 0.5) / P.sprocketTeeth * Math.PI * 2;
      const tm = mesh(new THREE.BoxGeometry(8, 6.4, 3.6), toothM);
      tm.position.set(s * L.trackCx, L.axleY + (rim + 2.4) * Math.cos(a), w.z + (rim + 2.4) * Math.sin(a));
      tm.rotation.x = a;
      g.add(tm);
    }
    if (!w.drive) g.add(cylX(2, s * (L.hw - 1), s * (L.trackOut + 3), L.axleY, w.z, mat(0xcfd3d6, { m: 0.8, r: 0.3 }), 12));
  }

  // 履帶（InstancedMesh）
  for (const side of ['L', 'R']) {
    const g = part(side === 'L' ? 'trackL' : 'trackR');
    const x = (side === 'L' ? 1 : -1) * L.trackCx;
    const n = L.links;
    const linkGeo = new THREE.BoxGeometry(P.trackW, P.trackT, P.trackPitch * 0.9);
    const grGeo = new THREE.BoxGeometry(P.trackW, P.grouser, 2.2);
    const im = new THREE.InstancedMesh(linkGeo, mat(COL.track, { r: 0.8 }), n);
    const ig = new THREE.InstancedMesh(grGeo, mat(0x23272b, { r: 0.9 }), n);
    im.castShadow = ig.castShadow = true; im.receiveShadow = true;
    const total = L.loop, step = total / n;
    const M = new THREE.Matrix4(), X = new THREE.Vector3(1, 0, 0);
    for (let i = 0; i < n; i++) {
      const { p, tan, nor } = loopPoint(i * step + step / 2);
      const N = new THREE.Vector3(0, nor[1], nor[0]);
      const Z = new THREE.Vector3().crossVectors(X, N);
      M.makeBasis(X, N, Z); M.setPosition(x, p[1], p[0]); im.setMatrixAt(i, M);
      M.makeBasis(X, N, Z); M.setPosition(x, p[1] + N.y * (P.trackT / 2 + P.grouser / 2), p[0] + N.z * (P.trackT / 2 + P.grouser / 2)); ig.setMatrixAt(i, M);
    }
    g.add(im, ig);
  }

  // 驅動板（藍色端子朝車身中央、VM 在後端；排針在外側長邊、IN1 在後端）
  {
    const g = part('driver'); const b = d.box; const y1 = d.y0 + 1.6;
    g.add(boxB(b.x0, b.x1, d.y0, y1, b.z0, b.z1, mat(0x15181c, { r: 0.5 })));
    for (let i = 0; i < 6; i++) {
      const zc = d.tz(i);
      g.add(boxB(b.x1 - 8, b.x1 - 0.5, y1, y1 + 10, zc - 2.45, zc + 2.45, mat(0x2f7fd6, { r: 0.5 })));
      g.add(cylY(1.6, y1 + 10, y1 + 10.3, b.x1 - 4.5, zc, mat(0xb9bec3, { m: 0.7 }), 12));
    }
    for (const dz of [-8, 10]) {   // DRV8870 ×2 與 R100 取樣電阻 ×2
      g.add(boxB(d.x - 1, d.x + 3, y1, y1 + 1.5, d.z + dz - 2.5, d.z + dz + 2.5, mat(0x111111)));
      g.add(boxB(d.x - 9, d.x - 3, y1, y1 + 2.2, d.z + dz - 1.6, d.z + dz + 1.6, mat(0x2b2b2b)));
    }
    g.add(boxB(b.x0 + 5, b.x0 + 13, y1, y1 + 4.5, b.z0 + 1, b.z0 + 7, mat(0x222222)));   // LM317M
    g.add(cylY(2.2, y1, y1 + 4, b.x0 + 9, b.z0 + 12, mat(0x2f6fd0), 16));                  // 可變電阻（轉到最小）
    g.add(boxB(b.x0 + 1.2, b.x0 + 3.8, y1, y1 + 2.5, d.hdrZ(0) - 1.27, d.hdrZ(9) + 1.27, mat(0x111111)));
    g.add(boxB(b.x0 + 1.1, b.x0 + 3.9, y1 + 2.5, d.hdrTop, d.hdrZ(0) - 1.3, d.hdrZ(5) + 1.3, mat(0x202020)));   // 杜邦頭：IN1–4、（VO 空）、G
  }
  // 電源區
  {
    const g = part('pd'); const b = pw.pd; const y1 = b.y0 + 1.6;
    g.add(boxB(b.x0, b.x1, b.y0, y1, b.z0, b.z1, mat(COL.pcbBlack, { r: 0.5 })));
    const r0 = pw.front ? b.z1 - 7.3 : b.z0, r1 = pw.front ? b.z1 : b.z0 + 7.3;
    g.add(boxB(pw.usbX - 4.5, pw.usbX + 4.5, y1, y1 + 3.2, r0, r1, mat(COL.metal, { m: 0.75, r: 0.3 })));   // USB-C 母座
    const cz = (b.z0 + b.z1) / 2 + pw.s * 3;
    g.add(boxB(pw.usbX - 1.5, pw.usbX + 1.5, y1, y1 + 0.9, cz - 1.5, cz + 1.5, mat(0x111111)));               // CH224K
    const oz = pw.front ? b.z0 + 3 : b.z1 - 3;
    for (const dx of [-3, 3]) g.add(boxB(pw.usbX + dx - 1.6, pw.usbX + dx + 1.6, y1, y1 + 0.4, oz - 1.6, oz + 1.6, mat(COL.copper, { m: 0.6 })));
  }
  {
    const g = part('buck'); const b = pw.buck; const y1 = b.y0 + 1.6;
    const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
    g.add(boxB(b.x0, b.x1, b.y0, y1, b.z0, b.z1, mat(COL.pcbBlue, { r: 0.5 })));
    g.add(boxB(cx - 3.5, cx + 3.5, y1, y1 + 4, cz - 3.5, cz + 3.5, mat(0x2a2b2e)));              // 電感
    g.add(boxB(cx + 4.5, cx + 6.5, y1, y1 + 1.2, cz - 1.5, cz + 1.5, mat(0x111111)));
    for (const s of [-1, 1]) g.add(boxB(cx + s * 5.5 - 1.2, cx + s * 5.5 + 1.2, y1, y1 + 1.6, b.z0 + 2, b.z0 + 5, mat(0xb88a4a)));
  }
  {
    const g = part('ldo'); const b = pw.ldo; const y1 = b.y0 + 1.6;
    const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
    g.add(boxB(b.x0, b.x1, b.y0, y1, b.z0, b.z1, mat(COL.pcbRed, { r: 0.5 })));
    g.add(boxB(cx - 3.3, cx + 3.3, y1, y1 + 1.8, cz - 3.5, cz + 3.5, mat(0x1a1a1a)));             // SOT-223
    g.add(boxB(cx - 3.3, cx + 3.3, y1, y1 + 0.3, cz + 3.5, cz + 5.5, mat(COL.metal, { m: 0.7 })));
  }
  {
    const g = part('cap'); const c = pw.cap;
    g.add(cylZ(c.r, c.z0, c.z1, c.x, c.y, mat(0x23324d, { r: 0.4 }), 24));
    g.add(cylZ(c.r - 0.5, c.z1, c.z1 + 0.3, c.x, c.y, mat(COL.metal, { m: 0.7, r: 0.3 }), 24));
    g.add(boxB(c.x - 1, c.x + 1, c.y + c.r - 0.2, c.y + c.r + 0.05, c.z0, c.z1, mat(0x9aa3ad)));   // 負極條紋
  }
  {
    const g = part('conn'); const c = L.conn;
    for (const [a, b] of [c.j1, c.j2]) g.add(boxB(c.x0, c.x1, c.y0, c.y1, a, b, mat(0xf2f2f2)));
  }

  // 電池艙：托盤、行動電源、綁帶、墊塊
  const B = L.bank;
  if (L.bay) {
    const g = part('tray'); const mT = mat(0x7d8b96);
    const xr = L.hw - 0.4, zf = L.bayZ1 - 0.3, nx = L.bayX1 - 0.4;
    const out = [[L.lipX0, z0], [L.bayX1, z0], [L.bayX1, z0 + E + 0.3], [xr, z0 + E + 0.3]];
    for (const p of L.pillars.filter(p => p.x1 > 0).sort((a, b) => a.z0 - b.z0)) out.push([xr, p.z0 - 0.4], [nx, p.z0 - 0.4], [nx, p.z1 + 0.4], [xr, p.z1 + 0.4]);
    out.push([xr, zf], [L.lipX0, zf]);
    const hs = L.trayWins.map(([a, b, c, e]) => rrect(a, b, c, e, 4));
    for (const zc of L.strapSlots) for (const xs of L.slotX) hs.push(rrect(xs - 1.5, zc - 11, xs + 1.5, zc + 11, 1.4));
    g.add(plateXZ(out, hs, L.trayY0, L.trayT, mT));
    g.add(boxB(L.lipX0, L.lipX1, L.trayTop, L.trayTop + 8, z0, zf, mT));
    if (P.bankSpacer > 0) {
      const sp = part('spacer');
      sp.add(boxB(B.x - (P.bankW - 6) / 2, B.x + (P.bankW - 6) / 2, L.trayTop, L.trayTop + Math.min(P.bankT, P.bayH - 1) * 0.8, B.z1, L.bayZ1, mat(0xd08a3a)));
    }
  }
  {
    const g = part('bank');
    const bm = mat(0x30353d, { r: 0.42 }), dk = mat(0x0d0f12), led = mat(0x55d6ff);
    const pt = B.port;
    if (L.bay) {
      g.add(plateXZ(rrect(B.x0, B.z0, B.x1, B.z1, Math.min(7, P.bankW / 5)), [], B.y0, P.bankT, bm));
      g.add(boxB(B.x0 + 8, B.x1 - 8, B.y1, B.y1 + 0.3, B.z0 + 14, B.z0 + 30, mat(0x4e8fd0, { r: 0.4 })));
      for (const px of [pt.x, pt.x - 13]) g.add(boxB(px - 4.5, px + 4.5, pt.y - 1.6, pt.y + 1.6, B.z0 - 0.3, B.z0 + 0.2, dk));
      for (let i = 0; i < 4; i++) g.add(boxB(B.x - P.bankW * 0.3 + i * 4, B.x - P.bankW * 0.3 + i * 4 + 1.6, pt.y - 0.8, pt.y + 0.8, B.z0 - 0.3, B.z0 + 0.2, led));
    } else {
      g.add(plateXY(rrect(B.x0, B.y0, B.x1, B.y1, 6), [], B.z0, P.bankT, bm));
      for (const dz of [-1, 1]) g.add(boxB(B.x1 - 0.2, B.x1 + 0.3, pt.y - 1.6 + dz * 6, pt.y + 1.6 + dz * 6, pt.z - 4.5, pt.z + 4.5, dk));
    }
  }
  {
    const g = part('strap'); const sm = mat(0x26292d, { r: 0.9 }); const th = 1.2;
    if (L.bay) for (const zc of L.strapZ) {
      g.add(boxB(B.x0 - th, B.x1 + th, B.y1, B.y1 + th, zc - 10, zc + 10, sm));
      g.add(boxB(B.x0 - th, B.x0, L.trayTop, B.y1 + th, zc - 10, zc + 10, sm));
      g.add(boxB(B.x1, B.x1 + th, L.trayTop, B.y1 + th, zc - 10, zc + 10, sm));
      const xa = L.slotX[0] - 1.5, xb = L.slotX[3] + 1.5;
      if (B.x0 - th > xa) g.add(boxB(xa, B.x0 - th, L.trayTop, L.trayTop + th, zc - 10, zc + 10, sm));
      if (B.x1 + th < xb) g.add(boxB(B.x1 + th, xb, L.trayTop, L.trayTop + th, zc - 10, zc + 10, sm));
    }
  }
}
function loopPoint(s) {
  // 履帶銷線的跑道形路徑，回傳 [z, y]
  const R = L.R, zS = L.zS, yA = L.axleY, straight = 2 * zS, arc = Math.PI * R;
  s = ((s % L.loop) + L.loop) % L.loop;
  if (s < straight) return { p: [-zS + s, yA - R], tan: [1, 0], nor: [0, -1] };
  s -= straight;
  if (s < arc) { const a = -Math.PI / 2 + s / R; return { p: [zS + R * Math.cos(a), yA + R * Math.sin(a)], tan: [-Math.sin(a), Math.cos(a)], nor: [Math.cos(a), Math.sin(a)] }; }
  s -= arc;
  if (s < straight) return { p: [zS - s, yA + R], tan: [-1, 0], nor: [0, 1] };
  s -= straight;
  const a = Math.PI / 2 + s / R; return { p: [-zS + R * Math.cos(a), yA + R * Math.sin(a)], tan: [-Math.sin(a), Math.cos(a)], nor: [Math.cos(a), Math.sin(a)] };
}

/* ---------- 身體 ---------- */
function buildBody() {
  const mF = mat(COL.print2), mFd = mat(0x8ea2b1);
  const f = part('frame');
  const xo = L.wallOut;
  // 底板（兼底盤上蓋）：右後方線孔對準通道、四根立柱的 M3 孔、前緣任務模組孔
  const hz = L.deckHole;
  const pinHoles = L.pillars.map(p => circ((p.x0 + p.x1) / 2, (p.z0 + p.z1) / 2, 1.7, 12));
  f.add(plateXZ(rrect(-xo, L.tubZ0, xo, L.tubZ1, 6), [rrect(hz.x0, hz.z0, hz.x1, hz.z1, 2), circ(-30, L.tubZ1 - 8, 1.7, 12), circ(30, L.tubZ1 - 8, 1.7, 12), ...pinHoles], L.deckY0, P.deckT, mF));
  const fh0 = L.deckY1, fh1 = L.frameTop;
  // 脊板（中下方穿線孔）
  f.add(plateXY(rrect(-L.wingX1, fh0, L.wingX1, fh1, 2), [rrect(-10, fh0 + 4, 10, fh0 + 16, 3)], L.spineZ0, 3, mF));
  // 側翼
  for (const s of [-1, 1]) f.add(boxB(s * L.wingX0, s * L.wingX1, fh0, fh1, L.inZ0 + 2, L.spineZ1, mF));
  // 斜撐（右邊在線孔上方斷開）
  for (const s of [-1, 1]) {
    const bx0 = s * (L.wingX0 - 6), bx1 = s * L.wingX0;
    const over = Math.min(bx0, bx1) < hz.x1 && Math.max(bx0, bx1) > hz.x0;
    const segs = over ? [[L.inZ0 + 2, hz.z0 - 2], [hz.z1 + 2, L.spineZ0]] : [[L.inZ0 + 2, L.spineZ0]];
    for (const [a, b] of segs) if (b - a > 3) f.add(boxB(bx0, bx1, fh0, fh0 + 10, a, b, mFd));
  }

  // 喇叭＋墊高環
  const r = part('spkRing');
  r.add(cylZ(L.spk.r + 2.2, L.spineZ1, L.spk.zB + 2, 0, L.spk.y, mat(0x7f95a6), 40));
  const s = part('speaker');
  s.add(cylZ(L.spk.r, L.spk.zF - 3, L.spk.zF, 0, L.spk.y, mat(0x2d2f33), 40));
  const cone = mesh(new THREE.ConeGeometry(L.spk.r - 3, 6, 40, 1, true), mat(0x151618, { side: THREE.DoubleSide }));
  cone.rotation.x = -Math.PI / 2; cone.position.set(0, L.spk.y, L.spk.zF - 3.2); s.add(cone);
  s.add(cylZ(L.spk.r * 0.55, L.spk.zB, L.spk.zF - 3, 0, L.spk.y, mat(0x9ea3a8, { m: 0.7, r: 0.35 }), 32));

  // 功放
  const a = part('amp');

  for (const dz of [8, 20]) pb.add(cylX(4, Q.x0 + 1.6, Q.x0 + 12, Q.y1 - 8, Q.z0 + dz, mat(0x223355), 18));
  pb.add(boxB(Q.x0 + 1.6, Q.x0 + 10, Q.y0 + 3, Q.y0 + 6, Q.z0 + 30, Q.z1 - 3, mat(0x111111)));
  pb.add(boxB(Q.x0 + 1.6, Q.x0 + 5, Q.y0 + 12, Q.y0 + 15, Q.z0 + 32, Q.z0 + 38, mat(0x333333)));

  // 開關

  const rk = boxB(L.sw.x - 6.5, L.sw.x + 6.5, L.sw.y1, L.sw.y1 + 6, L.sw.z - 9.5, L.sw.z + 9.5, mat(0xc63b2a));
  rk.rotation.x = 0.18; sw.add(rk);

  // 頂板／頸座

  const nz = P.neckZ;
  const winPts = [];

  const aOut = Math.acos(-wz / r1), aIn = Math.acos(-wz / r0);

  for (let i = 18; i >= 0; i--) { const t = -aIn + 2 * aIn * i / 18; winPts.push([r0 * Math.sin(t), nz - r0 * Math.cos(t)]); }
  const servoHole = rrect(L.servoBox.x0 - 0.2, L.servoBox.z0 - 0.2, L.servoBox.x1 + 0.2, L.servoBox.z1 + 0.2, 0.5);
  const swHole = rrect(L.sw.x - 6.5, L.sw.z - 9.5, L.sw.x + 6.5, L.sw.z + 9.5, 0.5);

  tp.add(plateXZ(rrect(-L.inW + 0.3, L.inZ0 + 0.3, L.inW - 0.3, L.inZ1 - 0.3, 3), topHoles, L.topY0, L.topT, mF));
  if (L.riserH > 0) {
    const rh = L.riserH, ry0 = L.topY1, rw = 20;

    for (const s of [-1, 1]) tp.add(boxB(s * (rw - 2.4), s * rw, ry0, ry0 + rh - 4, nz - rw, nz + rw, mF));
    tp.add(plateXZ(rrect(-rw - 6, nz - rw - 6, rw + 6, nz + rw + 6, 4), [servoHole, winPts], L.mountY0, 4, mF));
  }
  tp.add(ringY(L.collar.r0, L.collar.r1, L.collar.y0, L.collar.y1, 0, nz, mat(0x7c93a4)));
  for (const s of [-1, 1]) {

  }

  // 伺服機

  sv.add(boxB(sb.x0, sb.x1, sb.y0, sb.y1, sb.z0, sb.z1, sMat));
  const tabY0 = L.mountY0 - SERVO.tabT;
  const midX = (sb.x0 + sb.x1) / 2;
  sv.add(boxB(midX - SERVO.tabSpan / 2, midX + SERVO.tabSpan / 2, tabY0, L.mountY0, sb.z0, sb.z1, sMat));
  sv.add(cylY(SERVO.bossD / 2, sb.y1, L.bossTop, 0, nz, sMat, 24));

  sv.add(boxB(sb.x1 - 1, sb.x1 + 2, sb.y0 + 2, sb.y0 + 6, nz - 2, nz + 2, mat(0x6b3b1f)));

  }
  sh.add(plateXY(rrect(-L.bw, y0, L.bw, y1, 3), grille, L.bodyZ1 - P.shellT, P.shellT, mS));
  sh.add(plateXY(rrect(-L.bw, y0, L.bw, y1, 3), [rrect(-18, y1 - 30, 18, y1 - 26, 2), rrect(-18, y1 - 38, 18, y1 - 34, 2)], L.bodyZ0, P.shellT, mS));
  for (const s of [-1, 1]) sh.add(plateZY(rrect(L.bodyZ0 + P.shellT, y0, L.bodyZ1 - P.shellT, y1, 1), [], s > 0 ? L.bw - P.shellT : -L.bw, P.shellT, mS));
  // 胸前名牌與飾條
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
  const cx = cv.getContext('2d'); cx.fillStyle = '#2a2e33'; cx.fillRect(0, 0, 256, 64);
  cx.fillStyle = '#e8e2d6'; cx.font = 'bold 40px "Chakra Petch", sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText('ARES-1', 128, 34);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(40, 10), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 }));
  plate.position.set(0, y0 + 11, L.bodyZ1 + 0.25); sh.add(plate);
  sh.add(boxB(-L.bw, L.bw, y1 - 6, y1 - 3, L.bodyZ1, L.bodyZ1 + 0.8, mat(COL.shellAccent)));
  for (const s of [-1, 1]) for (const dz of [-25, 5]) sh.add(cylX(2.7, s * L.bw, s * (L.bw + 0.8), y0 + 8, dz, mat(0x666c72, { m: 0.6 }), 12));

  // 比較用：行動電源掛在身體背後的背包支架
  if (!L.bay) {
    const g = part('backpack'); const B = L.bank; const m = mat(0x5d7d99);
    g.add(boxB(B.x0 + 6, B.x1 - 6, B.y0 - 3, B.y0, B.z0 - 2, L.bodyZ0, m));
    for (const s of [-1, 1]) g.add(boxB(s * 30 - 5, s * 30 + 5, B.y0 - 3, B.y1 + 3, B.z1, L.bodyZ0, m));

      st.add(boxB(xc - 10, xc + 10, B.y1, B.y1 + 1.2, B.z0 - 1.2, L.bodyZ0, sm));
    }
  }
}
