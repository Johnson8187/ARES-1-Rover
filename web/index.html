function buildHead() {
  const h = L.head;
  const W = P.headW / 2;
  // 轉盤＋裙邊＋舵盤
  const hf = part('headFloor', headPivot);
  const mHF = mat(0x6e8597);
  hf.add(plateXZ(rrect(-W, h.z0, W, h.z1, 5), [circ(0, 0, 3, 16), circ(0, -L.harnessR, 4, 20)], 0, h.floorT, mHF));
  hf.add(ringY(L.skirt.r0, L.skirt.r1, -L.skirt.drop, 0, 0, 0, mHF));
  hf.add(boxB(-2.5, 2.5, -6, -2, -L.skirt.r1 - 3.5, -L.skirt.r1 + 0.2, mHF));
  hf.add(cylY(10, -2, 0, 0, 0, mHF, 28));
  hf.add(cylY(SERVO.hornD / 2, -2 - 1.8, -2, 0, 0, mat(0xf4f4f0), 28));
  hf.add(cylY(3.5, -(L.pivotY - L.bossTop), -3.8, 0, 0, mat(0xf4f4f0), 16));

  // 頭罩
  const hh = part('headHood', headPivot);
  const mH = mat(COL.shell, { r: 0.5 });
  const t = h.wall, H = P.headH;
  const lensX = P.lensOffset, lensY = h.pcbY;
  hh.add(plateXY(rrect(-W, h.floorT, W, H, 4), [circ(lensX, lensY, 6, 24)], h.z1 - t, t, mH));
  const micHoles = P.micInHead ? [circ(h.micLocal[0] - 3, h.micLocal[2], 0.75, 8), circ(h.micLocal[0], h.micLocal[2], 0.75, 8), circ(h.micLocal[0] + 3, h.micLocal[2], 0.75, 8)] : [];
  hh.add(plateXZ(rrect(-W, h.z0 + t, W, h.z1 - t, 3), micHoles, H - t, t, mH));
  hh.add(plateZY(rrect(h.z0 + t, h.floorT, h.z1 - t, H - t, 1), [rrect(h.pcbFrontZ - 2, lensY - 10, h.pcbFrontZ + 6, lensY + 10, 2)], W - t, t, mH));
  hh.add(plateZY(rrect(h.z0 + t, h.floorT, h.z1 - t, H - t, 1), [], -W, t, mH));
  // PCB 卡槽
  for (const s of [-1, 1]) for (const v of [-1, 1]) {
    hh.add(boxB(s * (ESP.l / 2 - 1.5), s * (W - t), lensY + v * (ESP.w / 2 - 4), lensY + v * (ESP.w / 2 + 1.5), h.pcbFrontZ - 3.5, h.pcbFrontZ + 2, mat(0xb9b4a8)));
  }
  // 護目鏡、眼睛、眼瞼
  const vz = h.z1;
  hh.add(plateXY(rrect(-W + 5, lensY - 13, W - 5, lensY + 13, 10), [circ(lensX, lensY, 6, 24)], vz, 0.8, mat(COL.visor, { r: 0.18, m: 0.2 })));
  const ex = h.eyeX;
  for (const s of [-1, 1]) {
    hh.add(plateXY(circ(s * ex, lensY, 14, 40), [circ(s * ex, lensY, 10, 40)], vz + 0.8, 1.8, mat(COL.eye, { r: 0.4 })));
    if (s !== h.camEye) {   // 裝飾眼：印出來的瞳孔＋反光點；鏡頭眼的瞳孔就是真鏡頭
      hh.add(plateXY(circ(s * ex, lensY, 6.5, 32), [], vz + 0.8, 0.6, mat(0x3a4550, { r: 0.2, m: 0.3 })));
      hh.add(plateXY(circ(s * ex + 2.5, lensY + 2.5, 1.6, 12), [], vz + 1.45, 0.3, mat(0xffffff, { r: 0.2 })));
    }
    const lid = [];
    for (let i = 0; i <= 16; i++) { const a = i / 16 * Math.PI; lid.push([14.5 * Math.cos(a), 14.5 * Math.sin(a) * 0.62]); }
    const lm = plateXY(lid, [], 0, 1.4, mat(0x565e66));
    lm.position.set(s * ex, lensY + 3, vz + 2.6);
    lm.rotation.z = -s * P.eyelid * D2R;
    hh.add(lm);
  }
  hh.add(plateXY(circ(lensX, lensY, 6, 28), [circ(lensX, lensY, 4.4, 28)], vz, 1.4, mat(0xb8bcc0, { m: 0.75, r: 0.3 })));
  // 頭部後蓋（散熱槽）
  const hb = part('headBack', headPivot);
  const vents = [];
  for (let i = -3; i <= 3; i++) vents.push(rrect(i * 7 - 1.4, H * 0.45, i * 7 + 1.4, H * 0.8, 1.2));
  hb.add(plateXY(rrect(-W, h.floorT, W, H, 4), vents, h.z0, t, mH));

  // ESP32-S3-CAM（依鏡頭點傾斜）
  const e = part('esp32', headPivot);
  const pcb = new THREE.Group();
  pcb.position.set(lensX, lensY, h.pcbFrontZ);
  pcb.rotation.x = P.camTilt * D2R;
  e.add(pcb);
  const ox = -lensX;
  const add = m => { pcb.add(m); return m; };
  add(boxB(ox - ESP.l / 2, ox + ESP.l / 2, -ESP.w / 2, ESP.w / 2, -ESP.t, 0, mat(COL.pcbBlack, { r: 0.45 })));
  const e0 = ox - ESP.l / 2;   // 天線端 PCB 邊緣（群組座標）
  add(boxB(e0 + ESP.shield0, e0 + ESP.shield1, -9, 9, 0, 3.1, mat(0xc4c8cc, { m: 0.8, r: 0.3 })));   // WROOM 鐵殼
  add(boxB(e0 - ESP.antOver, e0 + ESP.shield0, -9, 9, 0, 0.9, mat(0x2a2f36)));                      // 天線（突出 PCB）
  const onShield = lensX >= -ESP.l / 2 + ESP.shield0 + 3 && lensX <= -ESP.l / 2 + ESP.shield1 - 3;
  const cb = onShield ? 3.3 : 0.8;                                                                 // 相機模組墊在鐵殼上
  add(boxB(-4.3, 4.3, -4.3, 4.3, cb, cb + 2.4, mat(0x222222)));
  add(cylZ(4, cb + 2.4, Math.max(cb + 2.6, P.lensH - 1.2), 0, 0, mat(0x1d1f22, { r: 0.3 }), 24));
  add(cylZ(2.6, Math.max(cb + 2.6, P.lensH - 1.2), Math.max(cb + 3, P.lensH), 0, 0, mat(0x0a0c10, { r: 0.08, m: 0.5 }), 24));
  const fx0 = ox + ESP.fpcX;   // FPC 座
  add(boxB(fx0 - 2, fx0 + 2, -6.5, 6.5, 0, 1.3, mat(0x111111)));
  if (Math.abs(fx0) > 6) add(boxB(Math.min(4.3, fx0), Math.max(-4.3, fx0), -3.2, 3.2, cb + 0.1, cb + 0.4, mat(0xd08a2e, { r: 0.5 })));   // 橘色軟排線
  for (const dy of [-5.6, 5.6]) add(boxB(ox + ESP.l / 2 - 7.3, ox + ESP.l / 2 + 0.6, dy - 1.6, dy + 1.6, 0, 3.2, mat(0xaeb3b8, { m: 0.8, r: 0.3 })));   // OTG／TTL USB-C
  for (const s of [-1, 1]) {
    add(boxB(ox - 25.4, ox + 25.4, s * ESP.rowSp / 2 - 1.27, s * ESP.rowSp / 2 + 1.27, -ESP.t - 2.5, -ESP.t, mat(0x111111)));
    add(boxB(ox - 12.7, ox + 12.7, s * ESP.rowSp / 2 - 1.3, s * ESP.rowSp / 2 + 1.3, -ESP.t - 2.5 - ESP.dupont, -ESP.t - 2.5, mat(0x202020)));
  }
  const ko = add(boxB(e0 - ESP.antOver, e0 + ESP.shield0 + 1, -9, 9, 0.9, 10, mat(0x4aa3ff, { t: true, op: 0.14 })));
  ko.castShadow = false; ko.userData.keepout = true;

  // 麥克風
  const mc = part('mic', P.micInHead ? headPivot : root);
  if (P.micInHead) {
    const [mx, my, mz] = h.micLocal;
    mc.add(boxB(mx - 5, mx + 5, my - 1.2, my, mz - 5, mz + 5, mat(COL.pcbGreen, { r: 0.5 })));
    mc.add(cylY(1.6, my - 2.4, my - 1.2, mx, mz, mat(0xc0c4c8, { m: 0.7 }), 16));
  } else {
    const mx = -L.bw + 14, my = L.topY0, mz = L.bodyZ0 + 12;
    mc.add(boxB(mx - 5, mx + 5, my - 1.2, my, mz - 5, mz + 5, mat(COL.pcbGreen, { r: 0.5 })));
  }
}

function buildMission() {
  const g = part('mission');
  const m = mat(0xd9a441, { t: true, op: 0.55 });
  const zf = L.tubZ1 + 22;
  const shape = [];
  for (let i = 0; i <= 20; i++) { const x = -70 + 140 * i / 20; shape.push([x, 2 + 0.0025 * x * x]); }
  for (let i = 20; i >= 0; i--) { const x = -70 + 140 * i / 20; shape.push([x, 34 + 0.0025 * x * x]); }
  const blade = plateXY(shape, [], zf, 3, m);
  g.add(blade);
  for (const s of [-1, 1]) g.add(boxB(s * 20 - 2, s * 20 + 2, 20, 26, L.tubZ1, zf, m));
}

/* =========================================================
   8. 疊加層：尺寸、重心、視野、掃掠、配線、標籤
   ========================================================= */
function clearGroup(g) { while (g.children.length) { const c = g.children[g.children.length - 1]; g.remove(c); c.traverse(o => o.element?.remove()); disposeTree(c); } }
function line(pts, color, opacity = 1, dashed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const m = dashed ? new THREE.LineDashedMaterial({ color, dashSize: 4, gapSize: 3, transparent: true, opacity, depthTest: false }) : new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest: false });
  const l = new THREE.Line(geo, m); if (dashed) l.computeLineDistances(); l.renderOrder = 10; return l;
}
function tag2d(text, pos, cls) { const o = new CSS2DObject(labelDiv(text, cls)); o.position.copy(pos); return o; }
function accentHex() { return new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#B14E1C').getHex(); }

function buildOverlays() {
  const A = accentHex();
  // 尺寸
  const dg = overlays.dims; clearGroup(dg);
  const W = L.overallW / 2, zF = L.zMax + 18, y = 2;
  dg.add(line([new THREE.Vector3(-W, y, zF), new THREE.Vector3(W, y, zF)], A));
  dg.add(line([new THREE.Vector3(-W, 0, zF - 12), new THREE.Vector3(-W, 0, zF + 4)], A));
  dg.add(line([new THREE.Vector3(W, 0, zF - 12), new THREE.Vector3(W, 0, zF + 4)], A));
  dg.add(tag2d(`寬 ${fx(L.overallW, 0)}`, new THREE.Vector3(0, y, zF), 'lbl dim'));
  const xS = W + 18;
  dg.add(line([new THREE.Vector3(xS, y, L.zMin), new THREE.Vector3(xS, y, L.zMax)], A));
  dg.add(tag2d(`長 ${fx(L.overallL, 0)}`, new THREE.Vector3(xS, y, (L.zMin + L.zMax) / 2), 'lbl dim'));
  dg.add(line([new THREE.Vector3(xS, 0, L.zMin - 14), new THREE.Vector3(xS, L.overallH, L.zMin - 14)], A));
  dg.add(tag2d(`高 ${fx(L.overallH, 0)}`, new THREE.Vector3(xS, L.overallH / 2, L.zMin - 14), 'lbl dim'));
  dg.add(tag2d(`離地 ${fx(L.clearance, 1)}`, new THREE.Vector3(0, L.clearance / 2, L.tubZ1 + 4), 'lbl dim'));
  // 重心
  updateDynamicOverlays();
  // 標籤
  const lg = overlays.labels; clearGroup(lg);
  const names = { motorL: '左馬達（後）', motorR: '右馬達（前）', bank: '行動電源', driver: 'DRV8870', pd: 'CH224K', buck: 'Mini560', ldo: 'AMS1117', cap: 'C1', speaker: '喇叭', perf: '配電板', servo: 'SG92R', esp32: 'ESP32-S3-CAM', mic: 'INMP441', switch: '開關', amp: 'MAX98357A' };
  for (const [id, n] of Object.entries(names)) {
    const p = parts[id]; if (!p) continue;
    const b = new THREE.Box3().setFromObject(p.obj); const c = b.getCenter(new THREE.Vector3());
    const o = tag2d(n, c, 'lbl'); o.userData.partId = id; lg.add(o);
  }
}

function updateDynamicOverlays() {
  const A = accentHex();
  const st = stability(P, L, yaw);
  CHK.stDyn = st;
  const cg = overlays.cg; clearGroup(cg);
  const s = mesh(new THREE.SphereGeometry(4.5, 20, 14), new THREE.MeshBasicMaterial({ color: A, depthTest: false }));
  s.renderOrder = 12; s.position.copy(st.cg); cg.add(s);
  cg.add(line([st.cg.clone(), new THREE.Vector3(st.cg.x, 0.3, st.cg.z)], A, 0.9, true));
  const ex = L.trackOut, ez = L.zS;
  cg.add(line([new THREE.Vector3(-ex, 0.4, -ez), new THREE.Vector3(ex, 0.4, -ez), new THREE.Vector3(ex, 0.4, ez), new THREE.Vector3(-ex, 0.4, ez), new THREE.Vector3(-ex, 0.4, -ez)], A, 0.9));
  const poly = mesh(new THREE.PlaneGeometry(2 * ex, 2 * ez), new THREE.MeshBasicMaterial({ color: A, transparent: true, opacity: 0.12, depthWrite: false }));
  poly.rotation.x = -Math.PI / 2; poly.position.y = 0.3; poly.castShadow = poly.receiveShadow = false; cg.add(poly);
  cg.add(tag2d(`重心 ${fx(st.cg.y, 0)} mm · ${fx(st.mass, 0)} g`, st.cg.clone().add(new THREE.Vector3(0, 10, 0)), 'lbl cg'));
  // 視野
  const fg = overlays.fov; clearGroup(fg);
  const cf = cameraFrame(P, L, yaw);
  const len = 420, hh = Math.tan(cf.vfov / 2 * D2R), hwid = Math.tan(cf.hfov / 2 * D2R);
  const fwd = cf.dir.clone().normalize();

function batterySwap(on) {
  batDemo.from = batDemo.k; batDemo.to = on ? 1 : 0; batDemo.t0 = performance.now();
  batDemo.dist = L.bank.z1 - L.tubZ0 + 12;
  $('#btnBat').textContent = on ? '把行動電源放回去' : '換行動電源示範';
  if (on) {
    if (UI.asm >= 0) asmExit();
    UI.selected = 'bank'; refreshInspector();
    $('#stepbar').classList.add('on');
    $('#stepTitle').textContent = L.bay ? '換行動電源：從車尾抽出' : '換行動電源：背包式（比較用）';
    $('#stepText').textContent = BAT_STEPS[L.bay ? 'deck' : 'back'];
    setView('rear');
  } else if (UI.asm < 0) $('#stepbar').classList.remove('on');
}
function asmGo(i) {
  UI.asm = clamp(i, 0, ASM.length - 1);
  asmAnim.k = 1; asmAnim.t0 = performance.now();
  const s = ASM[UI.asm];
  $('#stepbar').classList.add('on');
  $('#stepTitle').textContent = `步驟 ${UI.asm + 1}／${ASM.length}：${s.t}`;
  $('#stepText').textContent = s.d.replace('${links}', L.links);
  renderAsmList();
  if (s.parts.length) { UI.selected = s.parts[0]; refreshInspector(); }
  applyState();
}
function asmExit() { UI.asm = -1; asmAnim.k = 0; $('#stepbar').classList.remove('on'); renderAsmList(); applyState(); }
function renderAsmList() {
  $('#asmList').innerHTML = ASM.map((s, i) => `<button class="step" data-i="${i}" aria-current="${i === UI.asm}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(s.t)}</button>`).join('');
  $$('#asmList .step').forEach(b => b.onclick = () => asmGo(+b.dataset.i));
}

function renderHud() {
  const st = stability(P, L, yaw);
  $('#hudKv').innerHTML = [
    ['外形 W×L×H', `${fx(L.overallW, 0)}×${fx(L.overallL, 0)}×${fx(L.overallH, 0)}`],
    ['估計重量', `${fx(st.mass, 0)} g`],
    ['重心高', `${fx(st.cg.y, 0)} mm`],
    ['翻覆門檻', `${fx(Math.min(st.aFront, st.aRear), 1)} m/s²`],
    ['續航（估）', `${fx(runtimeH(P), 1)} h`],
    ['離地間隙', `${fx(L.clearance, 1)} mm`],
    ['履帶片數', `${L.links}×2`],
  ].map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
  const cnt = { pass: 0, warn: 0, fail: 0, info: 0 };
  CHK.list.forEach(c => cnt[c.status]++);
  const lab = { fail: '干涉／失敗', warn: '注意', pass: '通過' };
  $('#hudChecks').innerHTML = ['fail', 'warn', 'pass'].filter(k => cnt[k] || k === 'pass').map(k => `<button class="pill ${k}" data-k="${k}"><span class="dot"></span>${lab[k]} ${cnt[k]}</button>`).join('');
  $$('#hudChecks button').forEach(b => b.onclick = () => selectTab('check'));
  $('#checkSummary').innerHTML = $('#hudChecks').innerHTML;
}
function renderChecks() {
  const order = { fail: 0, warn: 1, info: 2, pass: 3 };
  const groups = {};
  CHK.list.forEach((c, i) => { c.i = i; (groups[c.grp] ||= []).push(c); });
  const stLab = { pass: '通過', warn: '注意', fail: '失敗', info: '資訊' };
  $('#checkList').innerHTML = Object.entries(groups).map(([g, arr]) => `<h3>${esc(g)}</h3><div class="checklist">` +
    arr.sort((a, b) => order[a.status] - order[b.status]).map(c => `<button class="chk ${c.status}" data-i="${c.i}"><div class="h"><b>${esc(c.title)}</b><span class="st small"><span class="dot"></span> ${stLab[c.status]}</span></div><div class="d"><span class="mono">${esc(c.value)}</span> · ${esc(c.detail)}</div></button>`).join('') + '</div>').join('');
  $$('#checkList .chk').forEach(b => b.onclick = () => {
    const c = CHK.list[+b.dataset.i];
    UI.checkFocus = c.parts.length ? c.parts : null;
    if (/視野/.test(c.title)) { UI.fov = true; $('#optFov').checked = true; }
    if (/掃掠|窗口/.test(c.title)) { UI.sweep = true; $('#optSweep').checked = true; }
    if (/翻|坡/.test(c.title)) { UI.cg = true; $('#optCG').checked = true; }
    applyState();
  });
}

/* ---------- 檢視器（右側） ---------- */
function refreshInspector() {
  const box = $('#inspector');
  if (selectedWire && UI.wires && !UI.selected) { showWireInfo(selectedWire); return; }
  if (!UI.selected || !partInfo(UI.selected, P, L)) { box.innerHTML = overviewHtml(); bindOverview(); return; }
  const I = partInfo(UI.selected, P, L);
  const mi = CHK.stDyn?.items.find(i => i.id === UI.selected) || stability(P, L, yaw).items.find(i => i.id === UI.selected);
  const related = CHK.list.filter(c => c.parts.includes(UI.selected));
  box.innerHTML = `
    <h2>${esc(I.name)}</h2>
    <div class="kind"><span class="pill">${esc(I.kind)}</span><span class="pill">${esc(I.layer)}</span>${mi ? `<span class="pill mono">≈ ${fx(mi.m, 0)} g</span>` : ''}</div>
    <h4>尺寸（mm）</h4>
    <div class="tblwrap"><table><tbody>${I.dims.map(d => `<tr><td>${esc(d.label)}</td><td class="v">${esc(d.value)}</td><td>${tag(d.st)}</td></tr>`).join('')}</tbody></table></div>
    <h4>規格</h4><p>${esc(I.spec)}</p>
    <h4>用途</h4><p>${esc(I.use)}</p>
    ${I.mat ? `<h4>材料／列印</h4><p>${esc(I.mat)}</p>` : ''}
    ${I.notes.length ? `<h4>注意</h4><ul class="clean">${I.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
    ${related.length ? `<h4>相關檢查</h4>${related.map(c => `<div class="note ${c.status === 'fail' ? 'bad' : c.status === 'pass' ? 'ok' : c.status === 'info' ? 'info' : ''}"><b>${esc(c.title)}</b>：<span class="mono">${esc(c.value)}</span></div>`).join('')}` : ''}
    <div class="row" style="justify-content:flex-start;gap:6px;margin-top:12px"><button class="btn" id="insFocus">鏡頭對準</button><button class="btn" id="insClear">回到總覽</button></div>`;
  $('#insFocus').onclick = () => focusPart(UI.selected);
  $('#insClear').onclick = () => { UI.selected = null; applyState(); refreshInspector(); };
}
function showWireInfo(id) {
  const w = WIRE_DEFS.find(x => x.id === id); if (!w) return;
  $('#inspector').innerHTML = `<h2>${esc(w.name)}</h2><div class="kind"><span class="pill">配線</span><span class="pill">${esc(w.grp)}</span></div>
  <div class="tblwrap"><table><tbody><tr><td>從</td><td>${esc(w.from)}</td></tr><tr><td>到</td><td>${esc(w.to)}</td></tr><tr><td>線材</td><td>${esc(w.awg)}</td></tr><tr><td>走線長</td><td class="v">${fx(w.len, 0)} mm（剪線 +40）</td></tr></tbody></table></div>
  ${w.id === 'neck' ? `<div class="note">這條會跟著頭轉。拖動下方「頭部轉角」看它在頂板窗口裡怎麼移動。目前餘裕：${esc(CHK.list.find(c => /窗口/.test(c.title))?.value || '')}</div>` : ''}
  <div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="wClear">回到總覽</button></div>`;
  $('#wClear').onclick = () => { selectedWire = null; buildWires(); refreshInspector(); };
}

  return `<h2>${ttl}</h2>
  <p class="muted">雙履帶底盤、直立身體、可左右轉的頭。點模型上任何零件看尺寸與用途。</p>
  <h4>一眼看懂</h4>
  <div class="tblwrap"><table><tbody>
    <tr><td>外形</td><td class="v">${fx(L.overallW, 0)} × ${fx(L.overallL, 0)} × ${fx(L.overallH, 0)} mm</td></tr>
    <tr><td>重量（估）</td><td class="v">${fx(st.mass, 0)} g</td></tr>
    <tr><td>重心高</td><td class="v">${fx(st.cg.y, 1)} mm（總高 ${fx(st.cg.y / L.overallH * 100, 0)}%）</td></tr>
    <tr><td>翻覆角 前／後／側</td><td class="v">${fx(st.frontDeg, 0)}° / ${fx(st.rearDeg, 0)}° / ${fx(st.sideDeg, 0)}°</td></tr>
    <tr><td>建議加速度上限</td><td class="v">${fx(st.aRamp, 1)} m/s²</td></tr>
    <tr><td>頭部轉角</td><td class="v">±${P.yawMax}°（限位 ±${L.stopAng}°）</td></tr>
    <tr><td>鏡頭離地</td><td class="v">${fx(L.pivotY + L.head.pcbY, 0)} mm</td></tr>
    <tr><td>行動電源</td><td class="v">${P.bankL}×${P.bankW}×${P.bankT}、${P.bankMass} g、續航約 ${fx(runtimeH(P), 1)} h</td></tr>
  </tbody></table></div>
  ${L.bay ? '' : '<div class="note bad"><b>目前是「掛背後」比較模式。</b>到「參數 → 行動電源」切回「放電池艙」。</div>'}
  ${fails.length ? `<div class="note bad"><b>${fails.length} 項干涉／失敗</b>：${fails.map(f => esc(f.title)).join('、')}</div>` : '<div class="note ok"><b>沒有干涉。</b>所有機構檢查通過。</div>'}
  ${warns.length ? `<div class="note"><b>${warns.length} 項需要注意</b>：${warns.map(f => esc(f.title)).join('、')}</div>` : ''}
  <h4>設計重點</h4>
  <ul class="clean">
    <li><b>底盤是雙層巴士</b>：下層是馬達、驅動板和電源區，上層整層是行動電源的電池艙。學員自備的行動電源從車尾推進去，長的可以露出尾巴、薄的用魔鬼氈綁緊。按下面「換行動電源示範」看怎麼換。</li>
    <li><b>PD 誘騙 9 V</b>：CH224K 跟行動電源要 9 V；6 V 馬達 PWM 上限 66 %；Mini560 降 5 V 給大腦、伺服與喇叭。</li>
    <li><b>馬達對角擺</b>：左後右前，兩顆 64 mm 長的馬達在 110 mm 內寬裡完全錯開。</li>
    <li><b>右眼就是真鏡頭</b>：GOOUUU 板的相機貼在模組上、偏天線端約 20 mm，剛好是一隻眼睛的位置；左眼是造型眼。</li>
    <li><b>編碼器接回 ESP32</b>：A 相用 GPIO19/20（改用 TTL 口燒錄），3.3 V 由 AMS1117 供應。</li>
    <li><b>頸部線束繞開轉軸</b>：伺服佔住轉軸，線束改從轉軸後方 16 mm 穿過腎形窗口。</li>
    <li><b>外殼是套筒</b>：拆 4 顆螺絲往上拔，連頭都不用拆。</li>

  <div class="row" style="justify-content:flex-start;gap:6px;flex-wrap:wrap;margin-top:10px"><button class="btn primary" id="ovBat">換行動電源示範</button><button class="btn" data-go="asm">看組裝步驟</button><button class="btn" data-go="wire">看配線</button><button class="btn" data-go="spec">待量測清單</button></div>`;

function bindOverview() { $$('#inspector [data-go]').forEach(b => b.onclick = () => selectTab(b.dataset.go)); const ob = $('#ovBat'); if (ob) ob.onclick = () => batterySwap(batDemo.to < 1); }

/* =========================================================
   12. 參數 UI
   ========================================================= */
function renderParams() {
  $('#paramGroups').innerHTML = PARAM_UI.map(g => `<h3>${esc(g.group)}</h3>` + g.items.map(it => {
    const v = P[it.k];
    return `<div class="slider"><div class="lab">${esc(it.label)} ${tag(it.st)}</div><div class="val"><span id="pv_${it.k}">${fx(v, it.dec ?? (it.step < 1 ? 1 : 0))}</span> ${it.unit ?? (it.k === 'camTilt' || it.k === 'yawMax' || it.k === 'eyelid' ? '°' : it.k === 'mu' ? '' : 'mm')}</div>
      <input type="range" id="p_${it.k}" min="${it.min}" max="${it.max}" step="${it.step}" value="${v}" aria-label="${esc(it.label)}">
      ${it.hint ? `<div class="hint">${esc(it.hint)}</div>` : ''}</div>`;
  }).join('')).join('');
  PARAM_UI.flatMap(g => g.items).forEach(it => {
    const inp = $('#p_' + it.k);
    inp.addEventListener('input', () => {
      P[it.k] = parseFloat(inp.value);
      $('#pv_' + it.k).textContent = fx(P[it.k], it.dec ?? (it.step < 1 ? 1 : 0));
      if (it.k === 'yawMax') syncYawRange();
      scheduleBuild();
    });
  });
  $('#layoutNote').textContent = LAYOUT_NOTE[P.layout];
  setSeg('#layoutSeg', P.layout);
  const cur = Object.entries(BANKS).find(([, b]) => Object.keys(b).every(k => k === 'label' || P[k] === b[k]));
  $('#bankSeg').innerHTML = Object.entries(BANKS).map(([k, b]) => `<button data-v="${k}" aria-pressed="${!!cur && cur[0] === k}">${esc(b.label)}</button>`).join('');
  $$('#bankSeg button').forEach(b => b.onclick = () => { const { label, ...vals } = BANKS[b.dataset.v]; Object.assign(P, vals); renderParams(); build(); });
  setSeg('#mountSeg', P.bankMount);
  $('#bankNote').textContent = P.bankMount === 'back' ? '比較模式：行動電源掛在身體背後（身體自動加高，讓總高相同）。看「檢查 → 電池艙」的重心比較。' : '自己的行動電源不在清單上？直接拉下面「行動電源」的長、寬、厚與重量。';
  setSeg('#micSeg', P.micInHead ? 'head' : 'body');
}
let buildPending = false;
function scheduleBuild() { if (buildPending) return; buildPending = true; requestAnimationFrame(() => { buildPending = false; build(); }); }
function syncYawRange() {
  const y = $('#yaw'); y.min = -P.yawMax; y.max = P.yawMax;
  if (Math.abs(yaw / D2R) > P.yawMax) setYaw(clamp(yaw / D2R, -P.yawMax, P.yawMax));
}
function setSeg(sel, v) { $$(sel + ' button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }

/* =========================================================
   13. 互動
   ========================================================= */
function selectTab(name) {
  $$('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $$('.tabpane').forEach(p => p.hidden = p.dataset.pane !== name);
  if (name === 'spec') $('#specPane').innerHTML = specPaneHtml();
  if (name === 'wire' && !UI.wires) setWires(true);
}
$$('.tabs button').forEach(b => b.onclick = () => selectTab(b.dataset.tab));

function setWires(on) { UI.wires = on; $('#optWires').checked = on; $('#optWires2').checked = on; applyState(); }
$('#optWires').onchange = e => setWires(e.target.checked);
$('#optWires2').onchange = e => setWires(e.target.checked);
for (const [id, key] of [['optDims', 'dims'], ['optCG', 'cg'], ['optFov', 'fov'], ['optSweep', 'sweep'], ['optClash', 'clash'], ['optLabels', 'labels'], ['optMission', 'mission']]) $('#' + id).onchange = e => { UI[key] = e.target.checked; applyState(); };
for (const [id, key] of [['layChassis', 'chassis'], ['layBody', 'body'], ['layHead', 'head']]) $('#' + id).onchange = e => { UI.layers[key] = e.target.checked; applyState(); };
$$('#shellMode button').forEach(b => b.onclick = () => { UI.shell = b.dataset.v; setSeg('#shellMode', UI.shell); applyState(); });
$$('#sectionMode button').forEach(b => b.onclick = () => { UI.section = b.dataset.v; setSeg('#sectionMode', UI.section); applyState(); });
$('#section').oninput = e => { UI.sectionPos = +e.target.value; $('#sectionVal').textContent = `${UI.sectionPos} mm`; if (UI.section === 'off') { UI.section = 'x'; setSeg('#sectionMode', 'x'); } applyState(); };
$('#explode').oninput = e => { UI.explode = e.target.value / 100; $('#explodeVal').textContent = `${e.target.value}%`; applyState(); };
const keepBank = () => ({ bankL: P.bankL, bankW: P.bankW, bankT: P.bankT, bankMass: P.bankMass, bankCap: P.bankCap });
$$('#layoutSeg button').forEach(b => b.onclick = () => { P = { ...DEFAULTS, ...PRESETS[b.dataset.v], micInHead: P.micInHead, ...keepBank() }; renderParams(); syncYawRange(); build(); });
$$('#mountSeg button').forEach(b => b.onclick = () => {
  const v = b.dataset.v; if (v === P.bankMount) return;
  const y1 = computeLayout(P).bodyY1;
  P.bankMount = v;
  P.bodyH = Math.round(P.bodyH + (y1 - computeLayout(P).bodyY1));   // 總高不變，比較才公平
  if (batDemo.to) batterySwap(false);
  renderParams(); build();
});
$$('#micSeg button').forEach(b => b.onclick = () => { P.micInHead = b.dataset.v === 'head'; setSeg('#micSeg', b.dataset.v); build(); });
$('#btnReset').onclick = () => { P = { ...DEFAULTS }; renderParams(); syncYawRange(); build(); };
$('#btnScad').onclick = async () => {
  const keys = ['innerW', 'wheelbase', 'trackW', 'trackPitch', 'sprocketTeeth', 'plateT', 'trackGap', 'trackT', 'grouser', 'floorY', 'floorT', 'motorD', 'motorCan', 'encLen', 'gearLen', 'shaftD', 'shaftLen', 'motorHole', 'bankL', 'bankW', 'bankT', 'bankSpacer', 'bayH', 'drvL', 'drvW', 'buckL', 'buckW', 'buckH', 'spkD', 'spkH', 'bodyW', 'bodyD', 'bodyH', 'shellT', 'deckT', 'neckExtra', 'neckZ', 'headZ', 'headW', 'headH', 'headD', 'camTilt', 'lensOffset', 'lensH', 'eyelid', 'yawMax'];
  const txt = `// ARES-1 參數（由工程網頁產生）— 貼到 cad/ares1_params.scad 取代對應數值\n// layout = "${P.layout}"; mic_in_head = ${P.micInHead}; bankMount = "${P.bankMount}";\n` + keys.map(k => `${k} = ${P[k]};`).join('\n') + '\n';
  const ta = $('#scadOut'); ta.hidden = false; ta.value = txt;
  try { await navigator.clipboard.writeText(txt); $('#scadMsg').textContent = '已複製到剪貼簿。'; }
  catch { ta.select(); $('#scadMsg').textContent = '瀏覽器不允許自動複製，已幫你全選，請按 Ctrl/⌘+C。'; }
};

// 頭部轉角
function setYaw(deg) {
  yaw = deg * D2R;
  if (headPivot) headPivot.rotation.y = yaw;
  $('#yaw').value = deg; $('#yawVal').textContent = `${deg > 0 ? '+' : ''}${fx(deg, 0)}°`;
  if (CHK) { updateDynamicOverlays(); applyState(); renderHud(); }
}
$('#yaw').oninput = e => { scan.on = false; $('#yawScan').textContent = '掃描'; setYaw(+e.target.value); };
const scan = { on: false, t0: 0 };
$('#yawScan').onclick = () => { scan.on = !scan.on; scan.t0 = performance.now(); $('#yawScan').textContent = scan.on ? '停止' : '掃描'; };

// 視角
const VIEWS = { rear: [-0.85, 0.5, -1.1], iso: [1, 0.62, 1.15], front: [0, 0.18, 1], side: [1, 0.15, 0], top: [0, 1, -0.001], bottom: [0, -1, -0.001], head: [0.8, 0.35, 1] };
let camAnim = null;
function setView(v) {
  $$('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  const dir = new THREE.Vector3(...VIEWS[v]).normalize();
  const target = v === 'head' ? new THREE.Vector3(0, L.pivotY + P.headH / 2, P.neckZ) : new THREE.Vector3(0, L.overallH * 0.45, 0);
  const dist = v === 'head' ? 260 : Math.max(L.overallW, L.overallH, L.overallL) * 2.6 + 120;
  ground.visible = v !== 'bottom'; grid.visible = true;
  camAnim = { from: camera.position.clone(), to: target.clone().addScaledVector(dir, dist), tf: controls.target.clone(), tt: target, t0: performance.now() };
}
$$('.views button').forEach(b => b.onclick = () => setView(b.dataset.view));
function focusPart(id) {
  const p = parts[id]; if (!p) return;
  const b = new THREE.Box3().setFromObject(p.obj); const c = b.getCenter(new THREE.Vector3()); const s = b.getSize(new THREE.Vector3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  camAnim = { from: camera.position.clone(), to: c.clone().addScaledVector(dir, Math.max(140, s * 2.4)), tf: controls.target.clone(), tt: c, t0: performance.now() };
}

// 點選
const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const targets = [];
  if (UI.wires) targets.push(...overlays.wires.children);
  root.traverse(o => { if (o.isMesh && isShown(o) && !o.userData.keepout && !(o.material.transparent && o.material.opacity < 0.2 && !UI.wires)) targets.push(o); });
  let hits = ray.intersectObjects(targets, false);
  if (renderer.clippingPlanes.length) hits = hits.filter(h => secPlane.distanceToPoint(h.point) >= 0);
  const hw = hits.find(h => h.object.userData.wireId);
  const hp = hits.find(h => h.object.userData.partId && !(UI.wires && STRUCT.has(h.object.userData.partId)));
  if (UI.wires && hw && (!hp || hw.distance <= hp.distance + 3)) { selectedWire = hw.object.userData.wireId; UI.selected = null; buildWires(); showWireInfo(selectedWire); applyState(); return; }
  const h = hp || hits.find(x => x.object.userData.partId);
  UI.selected = h ? h.object.userData.partId : null;
  selectedWire = null; UI.checkFocus = null;
  if (UI.wires) buildWires();
  applyState(); refreshInspector();
});

// 尺寸與重繪
function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h); labelRenderer.setSize(w, h);
  camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(now) {
  requestAnimationFrame(tick);
  if (camAnim) {
    const k = Math.min(1, (now - camAnim.t0) / (reduceMotion ? 1 : 650)); const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(camAnim.from, camAnim.to, e); controls.target.lerpVectors(camAnim.tf, camAnim.tt, e);
    if (k >= 1) camAnim = null;
  }
  if (scan.on) { const d = Math.round(Math.sin((now - scan.t0) / 1400 * Math.PI) * P.yawMax); if (d !== Math.round(yaw / D2R)) setYaw(d); }
  if (UI.asm >= 0 && asmAnim.k > 0) {
    asmAnim.k = Math.max(0, 1 - (now - asmAnim.t0) / (reduceMotion ? 1 : 900));
    const e = asmAnim.k * asmAnim.k;
    const cur = new Set(ASM[UI.asm].parts);
    for (const id of cur) { const p = parts[id]; if (p) p.obj.position.copy(p.base).addScaledVector(p.vec, UI.explode + e); }
  }
  if (batDemo.k !== batDemo.to) {
    const k = Math.min(1, (now - batDemo.t0) / (reduceMotion ? 1 : 900));
    batDemo.k = batDemo.from + (batDemo.to - batDemo.from) * (1 - Math.pow(1 - k, 3));
    if (k >= 1) batDemo.k = batDemo.to;
    applyState();
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* 啟動 */
$('#btnBat').onclick = () => batterySwap(batDemo.to < 1);
$('#asmStart').onclick = () => asmGo(0);
$('#asmPrev').onclick = () => asmGo(UI.asm < 0 ? 0 : UI.asm - 1);
$('#asmNext').onclick = () => asmGo(UI.asm < 0 ? 0 : UI.asm + 1);
$('#asmExit').onclick = asmExit;
renderParams();
renderAsmList();
build();
// 除錯／文件用：在瀏覽器主控台輸入 __ares 可取得計算結果
window.__ares = { UI, BANKS, PRESETS, DEFAULTS, get parts() { return parts; }, applyState, overlays, get L() { return L; }, get P() { return P; }, set P(v) { P = v; }, build, stability, runChecks, computeLayout, massItems, fovOcclusion, get wires() { return WIRE_DEFS; } };
resize();
camera.position.set(0, 0, 0);
{ const dir = new THREE.Vector3(...VIEWS.iso).normalize(); controls.target.set(0, L.overallH * 0.45, 0); camera.position.copy(controls.target).addScaledVector(dir, Math.max(L.overallW, L.overallH, L.overallL) * 2.6 + 120); }
requestAnimationFrame(tick);
</script>
</body>
